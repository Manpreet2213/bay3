<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Heavy-duty truck mechanic trainer: guided electrical lessons, how-it-works animations, tools, and real diagnostic work orders.">
<meta name="theme-color" content="#1f5ea8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bay Three</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column shop app — sticky header with clock, job board / work order / career via bottom tabs */
:root{
  --bg:#eceeea; --panel:#f8f9f6; --ink:#1b2225; --muted:#5b666a; --line:#cfd5d2;
  --accent:#1f5ea8; --accent-ink:#ffffff; --amber:#b86e00; --good:#2f7d3e; --bad:#b3322b;
  --readout:#e3e8e4; --chip:#dde3e0;
  --wbr:#8a5a2b; --wye:#c99700; --wgr:#2f8a3e; --wrd:#c23b32;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14191b; --panel:#1c2326; --ink:#e4e9e6; --muted:#97a3a6; --line:#2f393c;
  --accent:#5b9be6; --accent-ink:#0d1416; --amber:#e3a23e; --good:#62b874; --bad:#e46a61;
  --readout:#11171a; --chip:#273034; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14191b; --panel:#1c2326; --ink:#e4e9e6; --muted:#97a3a6; --line:#2f393c;
  --accent:#5b9be6; --accent-ink:#0d1416; --amber:#e3a23e; --good:#62b874; --bad:#e46a61;
  --readout:#11171a; --chip:#273034; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1.2 var(--f-body);letter-spacing:.12em;color:var(--muted)}
.stats{display:flex;gap:14px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.stats b{display:block;font:700 18px/1 var(--f-display);letter-spacing:.02em}
.stats span{color:var(--muted);font-size:11px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:30px;font-weight:700;line-height:1.05}
h2{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.section{display:grid;gap:12px;margin-top:20px}
.label{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jobs{display:grid;gap:10px}
.fsel{width:100%;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:500 14px var(--f-body)}
.job{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--ink);cursor:pointer;font:inherit}
.job:disabled{opacity:.5;cursor:not-allowed}
.job:hover:not(:disabled){border-color:var(--accent)}
.ro{font:500 12px var(--f-mono);color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);border-right:2px solid var(--line);padding-right:8px}
.job .t{font:600 18px/1.15 var(--f-display);min-width:0}
.job .u{font-size:13px;color:var(--muted);min-width:0}
.tag{display:inline-block;font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--chip);color:var(--ink);margin-right:4px}
.grade{font:700 22px/1 var(--f-display);width:34px;text-align:center}
.g-A{color:var(--good)}.g-B{color:var(--accent)}.g-C{color:var(--amber)}.g-F{color:var(--bad)}
.wo{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wo-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px dashed var(--line);font:500 12px var(--f-mono);color:var(--muted)}
.wo-body{padding:14px;display:grid;gap:10px}
.complaint{font-size:16px;border-left:3px solid var(--amber);padding-left:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{font-size:13px}.kv b{display:block;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.clock{display:flex;align-items:center;gap:10px;font:500 13px var(--f-mono)}
.bar{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transition:width .3s}
.bar i.over{background:var(--bad)}
.tools{display:grid;gap:14px}
.tg{display:grid;gap:6px}
.test{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.test:hover:not(:disabled){border-color:var(--accent)}
.test:disabled{cursor:default;background:var(--chip)}
.test .h{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.log{background:var(--readout);border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.55 var(--f-mono);display:grid;gap:10px;max-height:340px;overflow:auto}
.log .e{min-width:0}.log .e b{color:var(--accent);font-weight:500}
.log .empty{color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opt small{display:block;color:var(--muted);font:12px var(--f-mono)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:5px;padding:12px 16px;font:600 16px var(--f-display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.result{border-radius:6px;padding:14px;border:1px solid var(--line);background:var(--panel);display:grid;gap:8px}
.result.ok{border-left:5px solid var(--good)}.result.part{border-left:5px solid var(--amber)}.result.fail{border-left:5px solid var(--bad)}
.big{font:700 40px/1 var(--f-display)}
.note{font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.ranks{display:grid;gap:6px}
.rank{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:14px}
.rank.on{border-color:var(--accent);font-weight:600}
.rank span{font:12px var(--f-mono);color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
nav button{flex:1;max-width:240px;background:none;border:0;color:var(--muted);padding:12px 4px;font:600 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted);font-size:13px}
nav button{font-size:13px;letter-spacing:.04em}
.tsvg{width:100%;max-width:120px;height:auto;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.flow span{background:var(--chip);border-radius:4px;padding:4px 8px;font:500 13px var(--f-body)}
.flow i{font-style:normal;color:var(--accent);font-weight:700}
.bpts{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
details.wo>summary{cursor:pointer;list-style:none}
details.wo>summary::-webkit-details-marker{display:none}
.mrules{display:grid;gap:4px;font-size:14px}
.anwrap{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#anim{display:block;width:100%;height:auto}
.ancap{padding:10px 12px;border-top:1px dashed var(--line);font-size:15px;min-height:3.2em}
.anctl{display:grid;gap:8px}
.anr{width:100%;accent-color:var(--accent);height:32px}
.lesson{background:var(--panel);border:2px solid var(--amber);border-radius:6px;overflow:hidden}
.lesson.ok{border-color:var(--good)}
.lstep{font-size:17px;font-weight:500}
.lexp{border-left:4px solid var(--good);padding-left:10px;font-size:15px}
.means{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:15px}
.hint{font-size:15px}
.tgtb{border-color:var(--amber)!important;box-shadow:inset 0 0 0 3px var(--amber)!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.tgtring{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.tgtring{animation:none}}
.tcards{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tcard>div{min-width:0}
.tname{font:600 18px/1.1 var(--f-display)}
.tuse{font-size:14px;margin-top:2px}
.ttip{font-size:13px;color:var(--muted);margin-top:4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpick{display:grid;justify-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);font:500 13px var(--f-body);cursor:pointer;text-align:center}
.tpick:hover:not(:disabled){border-color:var(--accent)}
.tpick.right{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good)}
.tpick.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.tpick .tsvg{max-width:90px}
.stbl{border-collapse:collapse;width:100%;font:14px var(--f-mono);font-variant-numeric:tabular-nums}
.stbl th,.stbl td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.stbl th{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab{gap:14px}
.diag{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;overflow-x:auto}
.circ{display:block;width:100%;min-width:320px;height:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meter{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px;display:grid;gap:10px}
.mdisp{background:var(--readout);color:var(--ink);border-radius:6px;padding:10px 12px;min-height:72px;display:grid;align-content:center}
.mread{font:500 34px/1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:pre}
.msub{font:12px var(--f-mono);color:var(--muted);margin-top:4px}
.mmodes,.mleads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mleads{grid-template-columns:1fr 1fr}
.mbtn{background:transparent;color:var(--bg);border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);border-radius:5px;padding:8px 6px;font:600 13px var(--f-body);cursor:pointer;text-align:left;min-width:0;overflow-wrap:anywhere}
.mmodes .mbtn{text-align:center}
.mbtn[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.mbtn.red{border-left:5px solid var(--bad)}
.mbtn.blk{border-left:5px solid var(--muted)}
.tps{display:grid;gap:8px}
.tpg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpgn{width:100%;font:600 12px var(--f-body);color:var(--muted)}
.tpb{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:5px;padding:8px 10px;font:500 13px var(--f-body);cursor:pointer}
.tpb.isr{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.tpb.isb{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.tpb.isr.isb{box-shadow:inset 0 0 0 2px var(--bad),inset 0 0 0 4px var(--ink)}
.scope{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header><div class="wrap" style="padding-block:0"><div class="hd">
  <div class="brand">Bay Three<small id="rankName">APPRENTICE · LEVEL 1</small></div>
  <div class="stats"><div><b id="sRep">0</b><span>REP</span></div><div><b id="sCash">$0</b><span>EARNED</span></div></div>
</div></div></header>

<main class="wrap" id="app"></main>

<nav>
  <button id="nBoard" data-v="board">Jobs</button>
  <button id="nJob" data-v="job">Order</button>
  <button id="nTools" data-v="tools">Learn</button>
  <button id="nLab" data-v="lab">Elec Lab</button>
  <button id="nCareer" data-v="career">Career</button>
</nav>

<script>
const RATE = 42; // $/flat-rate hour
const RANKS = [
  {n:"Apprentice · Level 1",r:0},{n:"Apprentice · Level 2",r:40},{n:"Apprentice · Level 3",r:100},
  {n:"310T Licensed Tech",r:250},{n:"Lead Hand",r:450},{n:"Shop Owner",r:700}];
// VMRS-style system groups (Code Key 31 level)
const VMRS = {"001":"Heating, A/C & Ventilation","002":"Cab & Sheet Metal","003":"Instruments & Gauges","011":"Front Axle & Steer Hubs","013":"Brakes","014":"Frame","015":"Steering","016":"Suspension","017":"Tires","018":"Wheels, Rims & Studs","022":"Drive Axles","023":"Clutch","024":"Driveshaft","025":"PTO","026":"Transmission","031":"Charging","032":"Cranking","033":"Ignition","034":"Lighting","035":"Batteries","041":"Air Intake","042":"Cooling","043":"Exhaust & Aftertreatment","044":"Fuel System","045":"Engine (Power Plant)","046":"Emissions / EGR","052":"Electrical Accessories","055":"Liftgate","059":"Coupling / Fifth Wheel","069":"Reefer","081":"Auxiliary Power Unit (APU)"};
const VM = {A101:"013",A102:"013",E201:"041",E202:"044",T301:"043",L401:"034",L402:"052",C501:"042",D601:"023",S701:"015",A103:"013",P801:"013",P802:"044",P803:"032"};
const vmOf = j => j.vm || VM[j.id];
const SYS = {car:"Car"};

// t = tool, n = test, h = hours, r = result, k = key finding
const JOBS = [
{id:"A101",sys:"air",lvl:1,title:"Air builds up slow",unit:"2018 Freightliner Cascadia · DD15 · Bendix AD-IS dryer",km:"612,400 km",book:2.0,
 complaint:"Driver says air takes forever to build in the morning. Hears a hiss from under the cab while it's building.",
 tests:[
  {t:"Gauges",n:"Build-up time 50→90 psi at 1,200 rpm",h:.2,r:"4 min 40 s. Must be under 3 min. Also 85→100 psi took 75 s (FMVSS 121 check allows 40 s). Too slow.",k:1},
  {t:"Gauges",n:"Governor cut-out / cut-in",h:.2,r:"Cut-out 128 psi, cut-in 106 psi. Within spec (cut-out typically 120–130, cut-in not below about 90)."},
  {t:"Gauges",n:"Applied leak test (combo)",h:.3,r:"2 psi/min with brakes applied. Within the 4 psi/min combination limit."},
  {t:"Visual",n:"Listen around dryer while building",h:.2,r:"Steady hiss from the dryer purge valve the whole time the compressor is loaded. Should only purge at cut-out.",k:1},
  {t:"Visual",n:"Compressor discharge line",h:.4,r:"Light carbon, no restriction. Line temperature normal."},
  {t:"Scan tool",n:"Read engine codes",h:.2,r:"No active codes."}],
 causes:["Worn air compressor","Air dryer purge valve stuck open","Governor out of adjustment","Leaking service brake chamber"],c:1,
 fixes:[{n:"Replace air compressor",p:1650,h:4.5},{n:"Replace dryer purge valve + service cartridge",p:310,h:1.2},{n:"Adjust governor",p:0,h:.5},{n:"Replace brake chamber",p:180,h:1}],f:1,
 note:"A purge valve that won't close dumps air the compressor is making. Governor numbers were fine, so the compressor was being told to pump. The air just wasn't staying."},

{id:"A102",sys:"air",lvl:1,title:"Pulls left, hot wheel end",unit:"2020 Kenworth T680 · Type 30 long-stroke chambers",km:"388,000 km",book:1.8,
 complaint:"Truck pulls right when braking. Driver noticed the left drive wheel smelled hot after a run, right side cool.",
 tests:[
  {t:"Gauges",n:"Measure pushrod stroke, all axles (95 psi apply)",h:.5,r:"Steer 1¾ in both. Drive L-fwd 2¾ in, others 1¾–2 in. Readjust limit for Type 30 long-stroke: 2½ in.",k:1},
  {t:"Visual",n:"Inspect slack adjuster on L-fwd drive",h:.3,r:"Automatic slack adjuster. Clevis and pin fine. Adjuster doesn't take up slack when cycled: stroke stays the same after 10 applications.",k:1},
  {t:"Visual",n:"Brake lining thickness",h:.4,r:"Linings 9–11 mm all positions. OK."},
  {t:"Visual",n:"Check drum for cracks/heat",h:.3,r:"L-fwd drum shows light heat checking, no cracks through. Within limits."},
  {t:"Scan tool",n:"ABS codes",h:.2,r:"No ABS faults."}],
 causes:["Worn brake linings","Faulty automatic slack adjuster","Cracked brake drum","Weak spring brake"],c:1,
 fixes:[{n:"Manually adjust the slack and release",p:0,h:.3},{n:"Replace auto slack adjuster, set install angle, verify stroke",p:145,h:1.3},{n:"Replace drum",p:260,h:2},{n:"Reline the axle",p:340,h:3}],f:1,
 note:"Out-of-adjustment brake on one side = that side does less work, so the truck pulls the other way. Hand-adjusting an auto slack only hides the problem. If it won't self-adjust, replace it."},

{id:"E201",sys:"eng",lvl:2,title:"Hard start, white smoke when cold",unit:"2017 Peterbilt 579 · Cummins X15",km:"801,200 km",book:2.2,
 complaint:"Cranks a long time on cold mornings, lots of white smoke until warm. Fine once warm.",
 tests:[
  {t:"Multimeter",n:"Battery voltage, engine off",h:.1,r:"12.6 V. Batteries OK."},
  {t:"Scan tool",n:"Cranking rpm",h:.2,r:"185 rpm. Normal cranking speed."},
  {t:"Scan tool",n:"Read codes",h:.2,r:"Inactive: Intake air heater circuit, voltage below normal (logged at each cold start)."},
  {t:"Multimeter",n:"Grid heater element resistance",h:.3,r:"0.18 Ω. Element is good (not open)."},
  {t:"Multimeter",n:"Voltage at heater during key-on preheat",h:.3,r:"0.0 V at the heater. Relay coil gets 12 V command from ECM, relay doesn't close. No click.",k:1},
  {t:"Gauges",n:"Fuel pressure, low side",h:.4,r:"Within spec. Filter restriction normal."}],
 causes:["Weak batteries","Failed intake heater element","Intake air heater relay not closing","Air in fuel"],c:2,
 fixes:[{n:"Replace batteries",p:620,h:.8},{n:"Replace heater element",p:280,h:1.5},{n:"Replace heater relay, verify heater current",p:95,h:.7},{n:"Bleed fuel system",p:0,h:.6}],f:2,
 note:"Cold-only white smoke points at preheat. The element tested good, the relay got commanded, but no voltage reached the heater. The relay is the break."},

{id:"E202",sys:"eng",lvl:3,title:"Low oil pressure light, hot idle",unit:"2015 Volvo VNL · D13",km:"1,040,000 km",book:3.0,
 complaint:"Oil pressure warning flickers at idle after a long run. Driver says oil level keeps going UP.",
 tests:[
  {t:"Gauges",n:"Mechanical oil pressure, hot idle",h:.4,r:"9 psi hot idle. Low for this engine."},
  {t:"Visual",n:"Check oil level & smell",h:.2,r:"Over full by about 3 L. Oil smells like diesel and is thin on the dipstick.",k:1},
  {t:"Visual",n:"Coolant in oil check",h:.2,r:"No milkiness, coolant level stable. Not coolant."},
  {t:"Scan tool",n:"Cylinder cutout / balance test",h:.6,r:"Cyl 4 correction factor far off the others. Possible injector issue.",k:1},
  {t:"Gauges",n:"Fuel system leak-down / injector return test",h:.8,r:"Cyl 4 injector leaking internally. Others within spec.",k:1},
  {t:"Multimeter",n:"Oil pressure sensor signal",h:.3,r:"Sensor reading matches mechanical gauge. Sensor is fine."}],
 causes:["Worn oil pump","Bad oil pressure sensor","Fuel dilution from leaking #4 injector","Worn main bearings"],c:2,
 fixes:[{n:"Replace oil pump",p:900,h:6},{n:"Replace pressure sensor",p:110,h:.5},{n:"Replace #4 injector (seals/sleeve inspect), change oil & filters",p:780,h:3.2},{n:"In-frame overhaul",p:12000,h:40}],f:2,
 note:"Rising oil level is the giveaway. Something is adding liquid. Diesel thins the oil, so pressure drops when hot. Fix the leak AND change the oil, or the bearings pay for it."},

{id:"T301",sys:"at",lvl:2,title:"Derate, emissions light",unit:"2021 International LT · A26",km:"244,000 km",book:2.0,
 complaint:"Check engine + emissions light on. Truck went into derate on the 401. Driver topped DEF at a small yard last week.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.2,r:"Active: SCR conversion efficiency below threshold. Derate stage 1."},
  {t:"Gauges",n:"DEF concentration (refractometer)",h:.2,r:"22.0 % urea. Spec 32.5 % (31.8–33.2). Diluted.",k:1},
  {t:"Scan tool",n:"NOx sensor in/out readings",h:.3,r:"Inlet ~ 700 ppm, outlet ~ 380 ppm at load. Low conversion, sensors agree with each other."},
  {t:"Visual",n:"DEF doser crystals / leaks",h:.4,r:"Doser clean, no crystal buildup."},
  {t:"Scan tool",n:"DPF soot load",h:.2,r:"Soot load 30 %. Normal."}],
 causes:["Failed outlet NOx sensor","Plugged DEF doser","Contaminated / diluted DEF","DPF needs cleaning"],c:2,
 fixes:[{n:"Replace NOx sensor",p:850,h:1},{n:"Replace DEF doser",p:600,h:1.4},{n:"Drain/flush DEF tank, refill, run SCR performance test",p:60,h:1.3},{n:"Send DPF for cleaning",p:700,h:2.5}],f:2,
 note:"Always test the fluid before buying sensors. Bad DEF = poor NOx conversion. Both sensors reading consistently backs that up."},

{id:"L401",sys:"elec",lvl:1,title:"Trailer left signal out",unit:"2019 Mack Anthem + 53' Utility reefer",km:"510,000 km",book:1.0,
 complaint:"Left turn on trailer is dead. Tractor signals work fine.",
 tests:[
  {t:"Multimeter",n:"7-way at tractor, yellow pin (left turn)",h:.1,r:"12.4 V flashing. Tractor side OK."},
  {t:"Multimeter",n:"Voltage at trailer nose box, yellow",h:.2,r:"12.3 V flashing. Good to the trailer."},
  {t:"Multimeter",n:"Voltage at rear left lamp feed",h:.2,r:"12.2 V flashing on the power wire. Power is arriving."},
  {t:"Multimeter",n:"Voltage drop on lamp ground (white)",h:.2,r:"4.1 V on the ground side while signaling. Should be under 0.2 V.",k:1},
  {t:"Visual",n:"Inspect lamp pigtail & ground ring",h:.2,r:"Ground ring terminal green with corrosion at the frame stud.",k:1},
  {t:"Visual",n:"Swap in known-good lamp",h:.1,r:"New lamp also dead in that position."}],
 causes:["Bad flasher","Open wire in trailer harness","Burnt-out LED lamp","High-resistance ground at the lamp"],c:3,
 fixes:[{n:"Replace flasher",p:40,h:.4},{n:"Run new harness",p:220,h:3},{n:"Replace lamp",p:35,h:.2},{n:"Clean/replace ground terminal, seal, retest",p:8,h:.5}],f:3,
 note:"Power in + no light = check the ground. A voltage drop over 0.2 V on a ground means resistance. Corrosion is the #1 trailer lighting fault in Ontario winters."},

{id:"L402",sys:"elec",lvl:2,title:"Dead batteries overnight",unit:"2020 Freightliner Cascadia sleeper",km:"420,000 km",book:2.0,
 complaint:"Batteries dead after a 34-hour reset. New batteries put in last month.",
 tests:[
  {t:"Multimeter",n:"Alternator output, running",h:.2,r:"14.1 V at 1200 rpm. Charging OK."},
  {t:"Multimeter",n:"Battery load test",h:.3,r:"All 4 pass. Batteries are good."},
  {t:"Multimeter",n:"Parasitic draw, key off, 30 min asleep",h:.4,r:"2.3 A draw. Should be under about 0.1 A once modules sleep.",k:1},
  {t:"Multimeter",n:"Pull fuses one at a time, watch draw",h:.6,r:"Draw drops to 0.06 A when the sleeper inverter feed is pulled. Inverter is wired straight to batteries, no shutoff.",k:1},
  {t:"Scan tool",n:"Check for module wake-ups",h:.3,r:"Modules go to sleep normally."}],
 causes:["Failing alternator","Bad batteries","Inverter wired direct, drawing with key off","Stuck starter relay"],c:2,
 fixes:[{n:"Replace alternator",p:520,h:1.5},{n:"Replace batteries again",p:620,h:.8},{n:"Rewire inverter through low-voltage disconnect, retest draw",p:85,h:1.2},{n:"Replace starter relay",p:30,h:.4}],f:2,
 note:"Charging tested good and batteries tested good, so something is eating power at rest. Fuse pulling with the meter on is the method. Aftermarket add-ons are the usual suspect."},

{id:"C501",sys:"cool",lvl:2,title:"Overheats on long hills",unit:"2016 Kenworth W900 · Cummins ISX15",km:"930,000 km",book:2.0,
 complaint:"Temperature climbs to 108 °C going up hills loaded. Driver never hears the fan kick in.",
 tests:[
  {t:"Visual",n:"Coolant level & condition",h:.1,r:"Full. Clean, correct coolant."},
  {t:"Visual",n:"Radiator / CAC fins",h:.2,r:"Some bugs, mostly clear. Not enough to cause this."},
  {t:"Scan tool",n:"Command fan ON",h:.2,r:"ECM shows fan commanded ON. Fan does NOT engage."},
  {t:"Gauges",n:"Air at fan clutch with fan commanded ON",h:.3,r:"120 psi still at the clutch. This clutch is spring-on / air-off, so air should be exhausted when fan is ON.",k:1},
  {t:"Multimeter",n:"Fan solenoid signal",h:.2,r:"Solenoid de-energizes correctly when commanded. Valve keeps passing air anyway.",k:1},
  {t:"Gauges",n:"Thermostat opening check",h:.5,r:"Opens at spec temperature. OK."}],
 causes:["Stuck thermostat","Low coolant","Fan clutch solenoid valve stuck, holding fan off","Plugged radiator"],c:2,
 fixes:[{n:"Replace thermostats",p:160,h:2},{n:"Top up coolant",p:20,h:.2},{n:"Replace fan solenoid valve, verify engage/disengage",p:120,h:.8},{n:"Recore radiator",p:1800,h:6}],f:2,
 note:"On a spring-engaged fan clutch, air releases it. Air present when fan should be on = valve stuck. The electrical signal was right, so it's the valve, not the ECM."},

{id:"D601",sys:"drv",lvl:2,title:"Clutch slips pulling hills",unit:"2014 Western Star 4900 · Eaton 18-speed · manual-adjust clutch",km:"1,110,000 km",book:2.5,
 complaint:"RPM flares going up grades loaded. Clutch pedal feels high.",
 tests:[
  {t:"Gauges",n:"Free pedal travel",h:.1,r:"¼ in. Spec 1½–2 in. Almost none.",k:1},
  {t:"Gauges",n:"Release bearing to clutch brake gap",h:.4,r:"⅛ in. Spec ½–9⁄16 in.",k:1},
  {t:"Visual",n:"Linkage & cross-shaft wear",h:.3,r:"Some bushing wear, within limits."},
  {t:"Visual",n:"Oil leak at rear main / trans input",h:.4,r:"Dry. No oil on clutch."},
  {t:"Scan tool",n:"Engine codes",h:.2,r:"No codes."}],
 causes:["Clutch worn and out of internal adjustment","Oil-soaked clutch disc","Weak engine","Broken clutch brake"],c:0,
 fixes:[{n:"Adjust external linkage only",p:0,h:.5},{n:"Internal clutch adjustment to ½ in bearing gap, then set free pedal",p:0,h:1.3},{n:"Replace rear main seal",p:400,h:9},{n:"Replace clutch brake",p:90,h:3}],f:1,
 note:"As the disc wears, the release bearing moves toward the clutch brake and free pedal disappears. Set the internal gap first, then the external free pedal (1½–2 in). Doing only the linkage hides it."},

{id:"S701",sys:"steer",lvl:1,title:"Wanders, steer tire wear",unit:"2019 Volvo VNL 860",km:"350,000 km",book:2.2,
 complaint:"Truck wanders on the highway. Inside edges of both steer tires feathered.",
 tests:[
  {t:"Gauges",n:"Measure toe",h:.4,r:"⅛ in toe-OUT. Spec about 1⁄16 in toe-IN.",k:1},
  {t:"Visual",n:"Tie rod ends, shake test",h:.3,r:"Both tie rod ends have visible up/down play when rocked by hand.",k:1},
  {t:"Visual",n:"Kingpin play",h:.4,r:"Within limits."},
  {t:"Visual",n:"Steering gear lash",h:.3,r:"Within limits."},
  {t:"Gauges",n:"Tire pressures",h:.1,r:"Steers at 110 psi. Correct for load."}],
 causes:["Worn kingpins","Low tire pressure","Worn tie rod ends causing toe-out","Bad steering gear"],c:2,
 fixes:[{n:"Kingpin job",p:600,h:6},{n:"Inflate tires",p:0,h:.2},{n:"Replace tie rod ends, align toe",p:260,h:2},{n:"Replace steering gear",p:1500,h:4}],f:2,
 note:"Toe-out wears the inside edges and makes the truck darty. Worn tie rod ends let toe change under load, so aligning alone won't hold. Fix parts first, then align."},

{id:"A103",sys:"air",lvl:2,title:"Trailer ABS lamp on",unit:"2018 Great Dane reefer · 4S/2M ABS",km:"n/a",book:1.3,
 complaint:"Trailer ABS lamp on the nose stays lit after power-up. Driver hit a pothole on the 400.",
 tests:[
  {t:"Scan tool",n:"Read trailer ABS codes",h:.2,r:"Sensor 'curb side rear' – open circuit."},
  {t:"Multimeter",n:"Sensor resistance at ECU connector",h:.3,r:"Open (OL). Typical spec roughly 1,000–2,500 Ω.",k:1},
  {t:"Multimeter",n:"Resistance at sensor itself",h:.3,r:"Still OL right at the sensor. Wiring is not the issue.",k:1},
  {t:"Visual",n:"Tone ring",h:.2,r:"Tone ring intact, no damage."},
  {t:"Visual",n:"Push sensor in to tone ring",h:.2,r:"Sensor pushed in. Lamp still on."}],
 causes:["Sensor air gap too big","Broken tone ring","Failed wheel speed sensor","Bad ABS ECU"],c:2,
 fixes:[{n:"Push sensor in",p:0,h:.2},{n:"Replace tone ring",p:120,h:3},{n:"Replace sensor + clip, push in, clear codes, verify lamp",p:65,h:.8},{n:"Replace ABS ECU",p:900,h:1.5}],f:2,
 note:"OL at the ECU and still OL at the sensor = sensor itself is open. Measure at both ends to split wiring from part."},

{id:"P801",sys:"car",lvl:1,title:"Brake squeal & pulsation",unit:"2016 Honda Civic",km:"148,000 km",book:1.8,
 complaint:"Squeals when braking and the pedal pulses at highway speed stops.",
 tests:[
  {t:"Visual",n:"Front pad thickness",h:.3,r:"2 mm. Wear indicator touching the rotor.",k:1},
  {t:"Gauges",n:"Rotor runout (dial indicator)",h:.3,r:"0.006 in. Typical max about 0.002 in.",k:1},
  {t:"Gauges",n:"Rotor thickness",h:.2,r:"At minimum spec."},
  {t:"Visual",n:"Caliper slides",h:.2,r:"Slightly dry, not seized."},
  {t:"Visual",n:"Brake fluid condition",h:.1,r:"OK."}],
 causes:["Low brake fluid","Worn pads + warped rotors","Seized caliper","Bad ABS module"],c:1,
 fixes:[{n:"Top up fluid",p:15,h:.2},{n:"Front pads + rotors, lube slides, bed in",p:180,h:1.4},{n:"Replace caliper",p:140,h:1},{n:"Replace ABS module",p:700,h:2}],f:1,
 note:"Squeal from the wear tab = pads done. Pulsation + runout over spec = rotors. Rotor at minimum thickness can't be machined, so replace."},

{id:"P802",sys:"car",lvl:1,title:"Check engine, lean code",unit:"2013 Toyota Corolla",km:"212,000 km",book:1.5,
 complaint:"Check engine light on. Rough idle sometimes.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.1,r:"P0171 System too lean, bank 1."},
  {t:"Scan tool",n:"Fuel trims at idle vs 2500 rpm",h:.2,r:"Long-term trim +22 % at idle, +3 % at 2500 rpm. Lean mainly at idle = unmetered air.",k:1},
  {t:"Gauges",n:"Smoke test intake",h:.4,r:"Smoke pouring from a cracked PCV hose under the intake.",k:1},
  {t:"Gauges",n:"Fuel pressure",h:.4,r:"In spec."},
  {t:"Multimeter",n:"MAF sensor readings",h:.3,r:"Reasonable for engine size."}],
 causes:["Weak fuel pump","Dirty MAF sensor","Vacuum leak at PCV hose","Bad O2 sensor"],c:2,
 fixes:[{n:"Replace fuel pump",p:350,h:2.5},{n:"Clean MAF",p:12,h:.3},{n:"Replace PCV hose, clear codes, check trims",p:25,h:.8},{n:"Replace O2 sensor",p:120,h:.5}],f:2,
 note:"Lean at idle that fixes itself at higher rpm = vacuum leak (the leak is a bigger share of air at idle). Fuel delivery problems get worse at high rpm."},

{id:"P803",sys:"car",lvl:1,title:"Clicks, won't crank",unit:"2012 Ford F-150 5.0",km:"260,000 km",book:1.2,
 complaint:"Turn the key, single click, nothing. Jump starts sometimes work.",
 tests:[
  {t:"Multimeter",n:"Battery voltage at rest",h:.1,r:"12.5 V. Battery charged."},
  {t:"Multimeter",n:"Battery load test",h:.2,r:"Pass."},
  {t:"Multimeter",n:"Voltage drop, battery + to starter, during crank",h:.2,r:"1.9 V drop. Spec under 0.5 V.",k:1},
  {t:"Visual",n:"Inspect positive cable & terminals",h:.2,r:"Positive cable corroded inside the insulation near the terminal (green, swollen).",k:1},
  {t:"Multimeter",n:"Ground side voltage drop",h:.2,r:"0.15 V. Ground OK."}],
 causes:["Dead battery","Bad starter","High-resistance positive cable","Bad ignition switch"],c:2,
 fixes:[{n:"Replace battery",p:220,h:.4},{n:"Replace starter",p:320,h:1.5},{n:"Replace positive battery cable, retest drop",p:70,h:.8},{n:"Replace ignition switch",p:90,h:1}],f:2,
 note:"A good battery and a click means current isn't getting through. Voltage drop testing during cranking finds the bad cable without guessing."},

{id:"H001",vm:"001",lvl:1,title:"A/C blows warm",unit:"2019 Freightliner Cascadia sleeper",km:"455,000 km",book:2.8,
 complaint:"Air conditioning blows warm in the afternoon. Driver hears the compressor clicking on and off.",
 tests:[
  {t:"Gauges",n:"Low/high side pressures, 1500 rpm, A/C max",h:.3,r:"Low side 15 psi, high side 110 psi on a 28 °C day. Both low.",k:1},
  {t:"Visual",n:"Watch compressor clutch",h:.1,r:"Clutch cycles on/off every few seconds. Short-cycling on low pressure."},
  {t:"Visual",n:"UV dye leak check",h:.5,r:"Dye glowing where the condenser line rubs a frame bracket. Line is chafed through.",k:1},
  {t:"Visual",n:"Cabin filter",h:.2,r:"Dirty, but airflow at the vents is fine."},
  {t:"Scan tool",n:"HVAC module codes",h:.2,r:"No codes."}],
 causes:["Failed A/C compressor","Refrigerant leak, low charge","Blend door stuck on heat","Plugged cabin filter"],c:1,
 fixes:[{n:"Replace A/C compressor",p:1100,h:4},{n:"Replace chafed line, secure it, evacuate, vacuum hold, recharge by weight",p:220,h:2.2},{n:"Recalibrate blend door",p:0,h:.5},{n:"Replace cabin filter",p:40,h:.3}],f:1,
 note:"Both sides low + short-cycling = low charge. Find the leak before you charge, and charge by weight, not by gauge. In Ontario you need an ODP card to handle refrigerant."},

{id:"B002",vm:"002",lvl:1,title:"Cab leans after sitting",unit:"2017 Volvo VNL · air-suspended cab",km:"690,000 km",book:1.5,
 complaint:"Cab sits low on the driver side in the morning. Levels out after driving a bit.",
 tests:[
  {t:"Gauges",n:"Measure cab height both sides after overnight",h:.2,r:"Driver side about 1 in lower than passenger side."},
  {t:"Gauges",n:"Soap test cab air springs & fittings",h:.3,r:"Bubbles from a crack at the bottom bead of the driver-side cab air spring.",k:1},
  {t:"Gauges",n:"Cab leveling valve operation",h:.3,r:"Valve fills and exhausts correctly when the arm is moved."},
  {t:"Visual",n:"Cab shocks",h:.2,r:"Dry, mounts tight."},
  {t:"Visual",n:"Cab mount bushings",h:.3,r:"Some wear, within limits."}],
 causes:["Bad cab leveling valve","Leaking cab air spring","Worn cab shocks","Broken cab mount"],c:1,
 fixes:[{n:"Replace cab leveling valve",p:160,h:1},{n:"Replace driver cab air spring, check cab height",p:190,h:1},{n:"Replace cab shocks",p:140,h:1},{n:"Replace cab mount",p:300,h:3}],f:1,
 note:"A slow leak that only shows after sitting = air spring or a fitting. The valve tested good, so the bag was losing the air."},

{id:"I003",vm:"003",lvl:2,title:"Speedo dead, cruise won't set",unit:"2016 Peterbilt 389 · Eaton 10-speed manual",km:"870,000 km",book:1.6,
 complaint:"Speedometer drops to zero going down the road. Cruise won't set.",
 tests:[
  {t:"Scan tool",n:"Read engine codes",h:.2,r:"Vehicle speed sensor: signal missing (was intermittent, now active)."},
  {t:"Scan tool",n:"Live data on road test: wheel speed vs vehicle speed",h:.4,r:"ABS wheel speed 90 km/h. Engine's vehicle speed 0.",k:1},
  {t:"Multimeter",n:"Resistance at transmission speed sensor",h:.3,r:"OL. Sensor coil is open.",k:1},
  {t:"Multimeter",n:"Harness continuity sensor → ECM",h:.3,r:"Under 1 Ω both wires. Harness OK."},
  {t:"Visual",n:"Tone wheel on output shaft",h:.4,r:"Teeth intact."}],
 causes:["Bad instrument cluster","Failed transmission speed sensor","ABS wheel sensor fault","Bad engine ECM"],c:1,
 fixes:[{n:"Replace cluster",p:900,h:1.5},{n:"Replace speed sensor, verify speedo & cruise",p:70,h:.8},{n:"Replace ABS sensor",p:65,h:.8},{n:"Replace ECM",p:2500,h:2}],f:1,
 note:"Speedo and cruise both run off the transmission speed sensor. ABS shows the truck is moving, so the sensor is what's not seeing it."},

{id:"X011",vm:"011",lvl:2,title:"Oil on steer rim, shimmy",unit:"2018 International LT · oil-bath steer hubs",km:"530,000 km",book:3.2,
 complaint:"Oil streaks on the inside of the left steer rim. Slight shimmy at highway speed.",
 tests:[
  {t:"Visual",n:"Hub cap oil level",h:.1,r:"Low, barely visible in the sight glass."},
  {t:"Gauges",n:"Wheel end play, dial indicator",h:.4,r:"0.009 in. TMC RP 618 target is 0.001–0.005 in.",k:1},
  {t:"Visual",n:"Pull wheel, inspect hub seal & shoes",h:.6,r:"Seal lip leaking. Oil soaked into the brake shoes.",k:1},
  {t:"Visual",n:"Tie rod ends",h:.2,r:"Tight."},
  {t:"Gauges",n:"Kingpin play",h:.4,r:"Within limits."}],
 causes:["Worn kingpins","Loose wheel bearing and leaking hub seal","Worn tie rod end","Tire out of balance"],c:1,
 fixes:[{n:"Kingpin job",p:600,h:6},{n:"Bearings & seal, set end play per RP 618, replace oily shoes (axle set)",p:420,h:2.6},{n:"Replace tie rod ends",p:260,h:2},{n:"Balance tire",p:30,h:.5}],f:1,
 note:"Too much end play lets the hub wobble, and that kills the seal. Oil-soaked shoes can't be saved. Replace both sides of the axle so braking stays even."},

{id:"F014",vm:"014",lvl:3,title:"Rust line on frame rail",unit:"2014 Kenworth T800 dump",km:"640,000 km",book:6.5,
 complaint:"Annual inspection flagged a rust line on the frame near the rear spring hanger.",
 tests:[
  {t:"Visual",n:"Clean and inspect rail",h:.4,r:"Rust bleed line on the web just ahead of the rear spring hanger."},
  {t:"Visual",n:"Dye penetrant test",h:.4,r:"Confirms a 3 in crack running from a bolt hole up the web.",k:1},
  {t:"Visual",n:"Check hanger bolts",h:.3,r:"Two hanger bolts loose, holes elongated.",k:1},
  {t:"Gauges",n:"Frame diagonal measurement",h:.6,r:"Within ⅛ in. Frame is square."},
  {t:"Visual",n:"Inspect other rail",h:.3,r:"No cracks."}],
 causes:["Surface rust only","Loose hanger bolts let it work, rail cracked","Bent frame","Overloaded once"],c:1,
 fixes:[{n:"Wire brush and paint",p:20,h:.3},{n:"Repair per OEM frame manual (stop-drill, approved reinforcement), new hanger bolts, torque",p:380,h:5.5},{n:"Weld a bead along the crack",p:40,h:1},{n:"Replace the whole rail",p:4000,h:30}],f:1,
 note:"Never freehand-weld a heat-treated frame rail. It cracks worse next to the weld. Follow the OEM repair procedure, and fix what caused it: the loose bolts."},

{id:"U016",vm:"016",lvl:1,title:"Rear sits low on air ride",unit:"2020 Freightliner Cascadia · Airliner suspension",km:"300,000 km",book:1.6,
 complaint:"Back of the tractor sits low. Fifth wheel height is off when hooking up.",
 tests:[
  {t:"Gauges",n:"Measure ride height",h:.2,r:"1½ in below spec."},
  {t:"Visual",n:"Raise leveling valve arm (fill)",h:.2,r:"No air goes to the bags when the arm is raised.",k:1},
  {t:"Gauges",n:"Air supply at leveling valve inlet",h:.3,r:"Full system pressure arriving at the valve.",k:1},
  {t:"Gauges",n:"Soap test air springs",h:.3,r:"No leaks."},
  {t:"Visual",n:"Leveling valve linkage",h:.1,r:"Attached and straight."}],
 causes:["Leaking air spring","Failed height control (leveling) valve","Broken linkage","Low system air"],c:1,
 fixes:[{n:"Replace air spring",p:180,h:1},{n:"Replace height control valve, set ride height",p:150,h:1.2},{n:"Replace linkage",p:30,h:.4},{n:"Repair air system",p:0,h:1}],f:1,
 note:"Air in, nothing out when you raise the arm = the valve. Always set ride height after. Wrong height throws off driveline angles."},

{id:"R017",vm:"017",lvl:1,title:"One dual wearing fast",unit:"2019 Mack Anthem · drive duals",km:"210,000 km",book:1.0,
 complaint:"Right rear inside drive tire is wearing way faster than the outside one.",
 tests:[
  {t:"Gauges",n:"Tread depth both duals",h:.2,r:"Inside 6/32, outside 12/32."},
  {t:"Gauges",n:"Cold tire pressures",h:.1,r:"Inside 85 psi, outside 105 psi.",k:1},
  {t:"Gauges",n:"Soap test valve stems",h:.2,r:"Inside dual: cap missing, valve core leaking slowly.",k:1},
  {t:"Gauges",n:"Measure circumference of both",h:.3,r:"Same size when inflated equal. Matched."},
  {t:"Gauges",n:"Drive axle alignment (thrust)",h:.8,r:"Within spec."}],
 causes:["Drive axle misaligned","Tires mismatched in size","Underinflated inside dual from leaking valve core","Bad shocks"],c:2,
 fixes:[{n:"Align drive axles",p:200,h:1.5},{n:"Replace both tires",p:900,h:1},{n:"New valve core & cap, set both to spec",p:10,h:.3},{n:"Replace shocks",p:200,h:1}],f:2,
 note:"Duals have to share the load. A low tire is smaller around, so it scrubs every turn. Small leak, big tire bill."},

{id:"W018",vm:"018",lvl:1,title:"Rust streaks from wheel nuts",unit:"2017 Western Star 5700 · hub-piloted wheels",km:"580,000 km",book:1.6,
 complaint:"Driver saw rust streaks coming from the nuts on the left rear outer wheel.",
 tests:[
  {t:"Visual",n:"Inspect wheel face",h:.1,r:"Rust trails running out from 4 studs like spokes.",k:1},
  {t:"Gauges",n:"Torque check",h:.2,r:"3 nuts turn well under spec. Typical hub-piloted spec 450–500 ft-lb.",k:1},
  {t:"Visual",n:"Pull wheel, check stud holes",h:.4,r:"Stud holes elongated. Wheel was running loose.",k:1},
  {t:"Visual",n:"Tire condition",h:.1,r:"OK."},
  {t:"Visual",n:"Brake drum",h:.2,r:"OK."}],
 causes:["Over-torqued nuts","Loose wheel, nuts lost clamp load","Bad tire","Cracked drum"],c:1,
 fixes:[{n:"Re-torque the nuts",p:0,h:.3},{n:"Replace wheel, studs & nuts on that hub, clean faces, torque in star pattern in 3 stages (~50 lb-ft, then 50–80 %, then final), re-torque after first run",p:260,h:1.2},{n:"Replace tire",p:450,h:.6},{n:"Replace drum",p:260,h:2}],f:1,
 note:"Rust trails = metal moving on metal. Once the holes are elongated the wheel can't hold clamp load. Only re-torquing is how wheels come off on the highway."},

{id:"Q022",vm:"022",lvl:2,title:"Howl from the rear",unit:"2016 Freightliner Columbia · tandem drives",km:"960,000 km",book:9.5,
 complaint:"Howl from the back at highway speed. Changes when going on/off throttle.",
 tests:[
  {t:"Visual",n:"Diff oil levels",h:.3,r:"Rear-rear axle 2 L low. Pinion seal wet.",k:1},
  {t:"Visual",n:"Magnetic drain plug",h:.2,r:"Heavy metal paste on rear-rear plug.",k:1},
  {t:"Gauges",n:"Pinion play at the yoke",h:.3,r:"Clear in-and-out play at the rear-rear yoke.",k:1},
  {t:"Road test",n:"Chassis ear / stethoscope",h:.5,r:"Noise loudest at the rear-rear diff."},
  {t:"Visual",n:"U-joints",h:.2,r:"Tight."}],
 causes:["Bad wheel bearing","Pinion bearings worn from low oil (leaking seal)","Tire noise","Worn U-joint"],c:1,
 fixes:[{n:"Replace wheel bearing",p:300,h:3},{n:"Rebuild rear-rear carrier pinion bearings + seal, refill correct gear oil",p:1600,h:8.5},{n:"Rotate tires",p:0,h:1},{n:"Replace U-joint",p:80,h:1}],f:1,
 note:"Leaking pinion seal → low oil → dry bearings → play and howl. Fix the leak AND the bearings. Check diff levels at every PM."},

{id:"V024",vm:"024",lvl:1,title:"Vibration at 100 km/h",unit:"2018 Kenworth T680",km:"470,000 km",book:1.4,
 complaint:"Vibration through the floor around 100 km/h. Worse on take-off.",
 tests:[
  {t:"Visual",n:"Pry-check U-joints",h:.3,r:"Rear U-joint on the main shaft has clear play.",k:1},
  {t:"Visual",n:"Grease U-joints, watch caps",h:.3,r:"One cap on that joint won't purge grease. Dry and worn.",k:1},
  {t:"Visual",n:"Driveshaft balance weights",h:.1,r:"All present."},
  {t:"Visual",n:"Yoke phasing",h:.2,r:"Yokes in phase."},
  {t:"Visual",n:"Center bearing",h:.2,r:"Rubber OK."}],
 causes:["Driveshaft out of phase","Worn U-joint (dry cap)","Bad center bearing","Tire out of round"],c:1,
 fixes:[{n:"Re-phase shaft",p:0,h:1},{n:"Replace U-joint, grease until all 4 caps purge",p:90,h:1},{n:"Replace center bearing",p:150,h:1.5},{n:"Balance tires",p:0,h:.5}],f:1,
 note:"When greasing, all four caps have to purge. A cap that won't purge runs dry and wears out. That shows up as play and vibration."},

{id:"K025",vm:"025",lvl:2,title:"PTO won't engage",unit:"2015 Mack Granite dump · air-shift PTO",km:"410,000 km",book:1.2,
 complaint:"PTO switch on, dash light comes on, but the pump won't turn. Box won't lift.",
 tests:[
  {t:"Multimeter",n:"Voltage at PTO air solenoid, switch on",h:.2,r:"12.4 V present."},
  {t:"Multimeter",n:"Solenoid coil resistance",h:.2,r:"OL. Coil is open.",k:1},
  {t:"Gauges",n:"Air at PTO shift cylinder, switch on",h:.3,r:"No air.",k:1},
  {t:"Visual",n:"Hydraulic oil level",h:.1,r:"Full."},
  {t:"Visual",n:"Pump shaft coupling",h:.3,r:"Intact."}],
 causes:["Bad PTO switch","PTO air solenoid coil open","Hydraulic pump failed","Low hydraulic oil"],c:1,
 fixes:[{n:"Replace switch",p:45,h:.5},{n:"Replace air solenoid, verify engage",p:90,h:.8},{n:"Replace pump",p:900,h:3},{n:"Add oil",p:30,h:.2}],f:1,
 note:"Power arriving, no air coming out = the solenoid. Test the electrical side, then the air side. Splitting it in half finds it fast."},

{id:"G026",vm:"026",lvl:2,title:"Won't shift to high range",unit:"2013 Peterbilt 386 · Eaton Fuller 10-speed",km:"1,200,000 km",book:1.8,
 complaint:"Flip the range lever up, it won't go into high. Stuck in low range.",
 tests:[
  {t:"Gauges",n:"Air filter/regulator output",h:.2,r:"About 60 psi. In spec."},
  {t:"Gauges",n:"Signal air at slave valve, range lever up",h:.3,r:"Signal air present.",k:1},
  {t:"Gauges",n:"Air at range cylinder high-range port",h:.3,r:"None. Slave valve isn't passing air.",k:1},
  {t:"Visual",n:"Shift knob range valve",h:.2,r:"Works, air switches lines."},
  {t:"Visual",n:"Air lines for kinks",h:.2,r:"None."}],
 causes:["Bad shift knob range valve","Low regulator pressure","Slave valve stuck","Worn range synchronizer"],c:2,
 fixes:[{n:"Replace shift knob",p:180,h:.8},{n:"Replace regulator",p:90,h:.6},{n:"Replace slave valve, verify range shifts",p:160,h:1},{n:"Rebuild auxiliary section",p:2500,h:14}],f:2,
 note:"Follow the air: regulator → knob → slave valve → range cylinder. Where the air stops is the fault."},

{id:"N031",vm:"031",lvl:1,title:"Dim lights, flat batteries",unit:"2018 Volvo VNL",km:"640,000 km",book:1.8,
 complaint:"Headlights dim at idle. Batteries keep running low even on long runs.",
 tests:[
  {t:"Multimeter",n:"Charging voltage at 1200 rpm",h:.2,r:"13.0 V. Expect about 13.8–14.4 V.",k:1},
  {t:"Multimeter",n:"AC ripple at alternator output",h:.2,r:"0.9 V AC. Should be under about 0.5 V. Diode damage.",k:1},
  {t:"Multimeter",n:"Voltage drop, charge cable",h:.2,r:"0.2 V. OK."},
  {t:"Visual",n:"Belt & tensioner",h:.1,r:"Good."},
  {t:"Multimeter",n:"Battery test",h:.3,r:"Batteries good, just undercharged."}],
 causes:["Bad batteries","Failed alternator diodes","Loose belt","Bad charge cable"],c:1,
 fixes:[{n:"Replace batteries",p:620,h:.8},{n:"Replace alternator, charge batteries, retest",p:520,h:1.4},{n:"Replace belt",p:60,h:.5},{n:"Replace charge cable",p:80,h:1}],f:1,
 note:"Low output + high AC ripple = bad diodes. The batteries were the victim, not the cause."},

{id:"M033",vm:"033",sys:"car",lvl:1,title:"Misfire, flashing check engine",unit:"2012 Nissan Altima 2.5",km:"190,000 km",book:1.0,
 complaint:"Shakes at idle, check engine light flashing on acceleration.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.1,r:"P0303: cylinder 3 misfire."},
  {t:"Visual",n:"Swap coil 3 with coil 1",h:.2,r:"Code moves to P0301. Misfire followed the coil.",k:1},
  {t:"Visual",n:"Spark plugs",h:.3,r:"Worn but even across all cylinders."},
  {t:"Gauges",n:"Compression test",h:.6,r:"All cylinders even."},
  {t:"Gauges",n:"Injector click test",h:.2,r:"All injectors clicking."}],
 causes:["Bad injector #3","Failed ignition coil #3","Low compression #3","Bad plug"],c:1,
 fixes:[{n:"Replace injector",p:150,h:1},{n:"Replace coil #3, clear codes, road test",p:90,h:.4},{n:"Head gasket",p:400,h:8},{n:"Replace plugs only",p:50,h:.8}],f:1,
 note:"Swap test: move the suspect part to another cylinder. If the misfire follows it, it's the part."},

{id:"Y035",vm:"035",lvl:1,title:"Slow crank, batteries keep failing",unit:"2016 Kenworth T680 · 4-battery bank",km:"720,000 km",book:1.2,
 complaint:"Slow cranking. Batteries were 'charged' twice this month.",
 tests:[
  {t:"Multimeter",n:"Bank voltage",h:.1,r:"12.4 V across the bank."},
  {t:"Multimeter",n:"Disconnect & check each battery voltage",h:.3,r:"#1 12.6 V, #2 12.6 V, #3 11.9 V, #4 12.6 V.",k:1},
  {t:"Multimeter",n:"Load test each battery",h:.4,r:"#3 drops to 9.1 V under load. Others pass.",k:1},
  {t:"Multimeter",n:"Charging voltage",h:.2,r:"14.1 V. Good."},
  {t:"Visual",n:"Cables & terminals",h:.2,r:"Clean and tight."}],
 causes:["Bad alternator","One failed battery dragging the bank down","Corroded cables","Bad starter"],c:1,
 fixes:[{n:"Replace alternator",p:520,h:1.5},{n:"Replace battery #3 (match type/age), charge, retest bank",p:180,h:.6},{n:"Clean cables",p:0,h:.5},{n:"Replace starter",p:450,h:2}],f:1,
 note:"In a parallel bank, one bad battery pulls the good ones down. Test them separated. A bank reading alone hides it."},

{id:"J041",vm:"041",lvl:2,title:"Low power, black smoke",unit:"2017 Peterbilt 579 · Cummins X15",km:"780,000 km",book:2.4,
 complaint:"No power on hills, puffs black smoke. Turbo sounds like it's whistling more than normal.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.2,r:"Inactive: intake manifold pressure below expected."},
  {t:"Gauges",n:"Air filter restriction",h:.1,r:"Within spec."},
  {t:"Gauges",n:"Charge air cooler pressure test, 30 psi",h:.5,r:"Drops 12 psi in 15 s. Cummins allows 7 psi in 15 s from 30 psi (other makers: about 5 psi).",k:1},
  {t:"Gauges",n:"Soap the CAC while pressurized",h:.2,r:"Bubbles at the seam of the left CAC tank.",k:1},
  {t:"Visual",n:"Turbo shaft play",h:.4,r:"Within limits."}],
 causes:["Plugged air filter","Cracked charge air cooler","Failed turbo","Bad injectors"],c:1,
 fixes:[{n:"Replace air filter",p:90,h:.3},{n:"Replace CAC, new clamps & boots, retest",p:1300,h:2},{n:"Replace turbo",p:2800,h:5},{n:"Replace injectors",p:4000,h:8}],f:1,
 note:"Boost leaking out = less air = black smoke and low power. Pressure-test the CAC before you blame the turbo."},

{id:"Z043",vm:"043",lvl:2,title:"Regens every day",unit:"2016 Kenworth T680 · PACCAR MX-13",km:"700,000 km",book:3.0,
 complaint:"Truck asks for a parked regen almost every day. Started a few weeks ago.",
 tests:[
  {t:"Scan tool",n:"Soot load after a parked regen",h:.3,r:"Soot load low. Regen completed fine."},
  {t:"Scan tool",n:"DPF differential pressure after regen",h:.3,r:"Still high for the airflow.",k:1},
  {t:"Visual",n:"Service records",h:.1,r:"DPF never cleaned. About 700,000 km.",k:1},
  {t:"Visual",n:"Pressure sensor hoses",h:.3,r:"Intact. Sensor reads about 0 kPa at key-on."},
  {t:"Visual",n:"Exhaust leaks before DPF",h:.3,r:"None."}],
 causes:["Bad differential pressure sensor","DPF loaded with ash","Cracked sensor hose","Too much idling"],c:1,
 fixes:[{n:"Replace pressure sensor",p:250,h:.6},{n:"Remove DPF for ash cleaning (or swap core), reset ash values",p:700,h:2.5},{n:"Replace hoses",p:40,h:.4},{n:"Tell driver to idle less",p:0,h:0}],f:1,
 note:"Regens burn soot, not ash. Ash only comes out by cleaning. High pressure right after a good regen = ash."},

{id:"O045",vm:"045",lvl:2,title:"Ticking from top of engine",unit:"2015 Freightliner Cascadia · DD15",km:"1,050,000 km",book:3.6,
 complaint:"Ticking at idle, slight loss of power. Overhead last done a long time ago.",
 tests:[
  {t:"Gauges",n:"Stethoscope on engine",h:.2,r:"Tick loudest at the valve cover."},
  {t:"Visual",n:"Valve cover off, inspect",h:.6,r:"No broken springs, rockers intact."},
  {t:"Gauges",n:"Feeler gauge valve lash",h:1,r:"Several valves well over spec.",k:1},
  {t:"Gauges",n:"Oil pressure",h:.3,r:"Normal."},
  {t:"Scan tool",n:"Cylinder cutout test",h:.4,r:"All cylinders contribute."}],
 causes:["Bad injector","Valves out of adjustment (overhead due)","Rod knock","Broken rocker"],c:1,
 fixes:[{n:"Replace injector",p:700,h:3},{n:"Overhead adjustment (valves + engine brake), new cover gasket",p:90,h:2.4},{n:"Bearing job",p:1500,h:20},{n:"Replace rocker",p:200,h:3}],f:1,
 note:"Loose lash = tick and lost power because valves open late. An overhead is routine PM on high-mile engines."},

{id:"G046",vm:"046",lvl:3,title:"Losing coolant, no leak",unit:"2014 Volvo VNL · D13",km:"990,000 km",book:7.0,
 complaint:"Adds 2 L of coolant a week. No puddles. White smoke at startup that smells sweet.",
 tests:[
  {t:"Gauges",n:"Cooling system pressure test",h:.5,r:"Slowly loses pressure. No external drips."},
  {t:"Visual",n:"Check oil for coolant",h:.2,r:"Oil clean. No milkiness."},
  {t:"Visual",n:"Startup exhaust smoke",h:.2,r:"White, sweet-smelling smoke on cold start.",k:1},
  {t:"Gauges",n:"Isolate & pressure test EGR cooler",h:1.2,r:"Leaks down. Coolant found in the EGR outlet pipe.",k:1},
  {t:"Visual",n:"Water pump weep hole",h:.2,r:"Dry."}],
 causes:["Head gasket","EGR cooler leaking internally","Water pump weeping","Radiator leak"],c:1,
 fixes:[{n:"Head gasket",p:1500,h:20},{n:"Replace EGR cooler, check turbo & DPF for coolant damage, refill",p:1600,h:6},{n:"Water pump",p:400,h:3},{n:"Radiator",p:1800,h:6}],f:1,
 note:"Coolant gone, no puddle, clean oil, sweet white smoke = it's going out the exhaust. The EGR cooler is the classic spot."},

{id:"C059",vm:"059",lvl:1,title:"Trailer clunks on take-off",unit:"2019 Freightliner + 53' dry van · Holland FW35 fifth wheel",km:"330,000 km",book:1.0,
 complaint:"Clunk every time the truck takes off or brakes. Feels like slack in the hitch.",
 tests:[
  {t:"Visual",n:"Rock trailer, watch kingpin in jaw",h:.2,r:"Kingpin moves forward and back in the lock.",k:1},
  {t:"Gauges",n:"Lock adjustment check",h:.3,r:"Lock out of adjustment, too loose.",k:1},
  {t:"Gauges",n:"Kingpin wear gauge",h:.2,r:"Within limits."},
  {t:"Visual",n:"Mounting bolts",h:.2,r:"Tight."},
  {t:"Visual",n:"Fifth wheel plate",h:.1,r:"Dry, needs grease."}],
 causes:["Worn kingpin","Fifth wheel lock out of adjustment","Loose fifth wheel mounting","Cracked trailer upper coupler"],c:1,
 fixes:[{n:"Replace kingpin",p:300,h:4},{n:"Adjust lock per maker's procedure, grease plate, verify",p:0,h:.7},{n:"Torque mounting",p:0,h:.5},{n:"Repair upper coupler",p:1200,h:10}],f:1,
 note:"Slack in the lock = shock loads on everything. Adjust and grease at every PM. A loose lock can also let the trailer drop."},

{id:"T069",vm:"069",lvl:2,title:"Reefer won't hold temp",unit:"2018 53' reefer · diesel transport refrigeration unit",km:"n/a",book:1.3,
 complaint:"Set to −18 °C with frozen load. Box only holds −8 °C on hot days.",
 tests:[
  {t:"Scan tool",n:"Unit alarm codes",h:.2,r:"High discharge pressure warning."},
  {t:"Gauges",n:"Discharge pressure",h:.3,r:"Well above normal for ambient.",k:1},
  {t:"Visual",n:"Condenser coil",h:.2,r:"Packed with road dirt and bugs.",k:1},
  {t:"Visual",n:"Evaporator airflow",h:.2,r:"Good."},
  {t:"Visual",n:"Door seals",h:.2,r:"Sealing fine."}],
 causes:["Low refrigerant","Dirty condenser coil","Failed compressor","Bad door seals"],c:1,
 fixes:[{n:"Recharge refrigerant",p:200,h:1.5},{n:"Clean condenser coil, verify pressures & pull-down",p:20,h:1},{n:"Replace compressor",p:2500,h:6},{n:"Replace door seals",p:300,h:2}],f:1,
 note:"A dirty condenser can't get rid of heat, so pressure climbs and the unit loses capacity. Wash the coils at every PM."},

{id:"L055",vm:"055",lvl:1,title:"Liftgate motor runs, won't lift",unit:"2017 26' straight truck · hydraulic liftgate",km:"260,000 km",book:1.2,
 complaint:"Pump motor runs when you press UP, but the gate doesn't move.",
 tests:[
  {t:"Visual",n:"Hydraulic reservoir level",h:.1,r:"Very low.",k:1},
  {t:"Visual",n:"Look for leaks",h:.2,r:"Wet hose fitting at the lift cylinder.",k:1},
  {t:"Multimeter",n:"Voltage at pump motor",h:.2,r:"12.2 V while running. OK."},
  {t:"Visual",n:"Lowering valve",h:.3,r:"Closes properly."},
  {t:"Multimeter",n:"Liftgate battery charge",h:.2,r:"Good."}],
 causes:["Weak pump motor","Low fluid from leaking hose","Lowering valve stuck open","Dead liftgate battery"],c:1,
 fixes:[{n:"Replace pump motor",p:450,h:2},{n:"Replace leaking hose, refill with correct fluid, cycle gate",p:90,h:1},{n:"Replace lowering valve",p:120,h:1},{n:"Replace battery",p:200,h:.5}],f:1,
 note:"Motor runs but nothing moves = the pump has nothing to push. Find the leak, then refill."},

// ===== BATCH 1: BRAKES =====
{id:"B131",vm:"013",lvl:2,title:"Trailer spring brakes won't release",unit:"2017 Wabash 53' dry van · tandem spring brakes",km:"n/a",book:1.6,
 complaint:"Push the red trailer valve in, hear air, but trailer brakes stay on. Can't pull away.",
 tests:[
  {t:"Gauges",n:"Pressure at trailer supply (red) gladhand",h:.2,r:"118 psi. Tractor is sending supply air."},
  {t:"Gauges",n:"Pressure in trailer reservoir",h:.2,r:"110 psi. Tank is filling."},
  {t:"Gauges",n:"Pressure at spring brake chamber hold-off ports",h:.3,r:"0 psi. No air reaching the spring side.",k:1},
  {t:"Gauges",n:"Air at spring brake control valve inlet vs outlet",h:.3,r:"Full pressure in, nothing out. Valve isn't delivering.",k:1},
  {t:"Visual",n:"Spring chamber condition",h:.2,r:"No damage, no caging bolts installed."}],
 causes:["Tractor protection valve failed","Trailer spring brake control valve not delivering","Broken spring brake chambers","Kinked supply line on tractor"],c:1,
 fixes:[{n:"Replace tractor protection valve",p:180,h:1},{n:"Replace trailer spring brake control valve, verify release & apply",p:210,h:1.2},{n:"Replace spring chambers",p:400,h:2},{n:"Replace tractor supply line",p:60,h:.6}],f:1,
 note:"Follow the air in order: gladhand → tank → valve → chambers. Air reached the valve but didn't leave it, so that valve is the fault."},

{id:"B132",vm:"013",lvl:1,title:"Low air warning comes on too late",unit:"2019 Kenworth T880",km:"260,000 km",book:.9,
 complaint:"Failed pre-trip at the yard: low air buzzer didn't sound until the gauge was way down.",
 tests:[
  {t:"Gauges",n:"Fan down air with key on, note warning point",h:.2,r:"Warning comes on at 38 psi. It should be on until about 60 psi on build-up and come back on by then on fan-down. Not working at 55 psi and below is out-of-service.",k:1},
  {t:"Gauges",n:"Compare dash gauge to master test gauge",h:.2,r:"Dash gauge reads within 2 psi of master. Gauge is accurate."},
  {t:"Multimeter",n:"Low-pressure switch: continuity vs pressure",h:.3,r:"Switch closes at 38 psi on the bench rig. Out of spec.",k:1},
  {t:"Visual",n:"Buzzer & lamp function",h:.1,r:"Both work when the switch is jumped."},
  {t:"Gauges",n:"Parking valve pop-out point",h:.2,r:"Pops out at 35 psi. Within the 20–45 psi range."}],
 causes:["Bad dash gauge","Low-pressure warning switch out of spec","Bad buzzer","Parking control valve fault"],c:1,
 fixes:[{n:"Replace dash gauge",p:120,h:1},{n:"Replace low-pressure switch, retest warning point",p:45,h:.5},{n:"Replace buzzer",p:30,h:.4},{n:"Replace parking valve",p:150,h:.8}],f:1,
 note:"The driver needs warning while there is still air to stop. A switch that trips late makes this an out-of-service defect."},

{id:"B133",vm:"013",lvl:2,title:"Parking knob won't pop out",unit:"2016 Volvo VNL",km:"880,000 km",book:1.0,
 complaint:"During air brake pre-trip, the yellow knob didn't pop out until the gauge was almost empty.",
 tests:[
  {t:"Gauges",n:"Fan down: note yellow knob pop-out",h:.2,r:"Pops at 9 psi. Should pop in the 20–45 psi range (exact point varies by maker).",k:1},
  {t:"Gauges",n:"Fan down: note red trailer knob pop-out",h:.2,r:"Pops at 34 psi. OK."},
  {t:"Visual",n:"Knob shaft & bezel",h:.2,r:"No binding from the dash panel. Valve itself is sticky.",k:1},
  {t:"Gauges",n:"Spring brakes apply when knob pulled",h:.1,r:"Yes, normal."},
  {t:"Gauges",n:"Low air warning point",h:.2,r:"Comes on at 62 psi. OK."}],
 causes:["Weak spring brake chambers","Dash parking control valve sticking","Tractor protection valve fault","Low air switch fault"],c:1,
 fixes:[{n:"Replace spring chambers",p:400,h:2},{n:"Replace dash parking control valve, retest pop-out",p:150,h:.8},{n:"Replace tractor protection valve",p:180,h:1},{n:"Replace low air switch",p:45,h:.5}],f:1,
 note:"The yellow knob must pop on its own so spring brakes apply automatically. A valve that sticks too long is unsafe."},

{id:"B134",vm:"013",lvl:2,title:"Air disc brake pulling, uneven pads",unit:"2021 Freightliner Cascadia · air disc brakes",km:"190,000 km",book:2.0,
 complaint:"Pulls left under braking. Driver noticed the right front wheel stays clean, left one is dusty.",
 tests:[
  {t:"Visual",n:"Pad thickness, both steer calipers",h:.4,r:"Left pads even. Right pads tapered and inner pad thicker than outer."},
  {t:"Visual",n:"Slide caliper by hand (right)",h:.3,r:"Right caliper won't slide on its guide pins. Seized.",k:1},
  {t:"Gauges",n:"Rotor thickness & cracks",h:.3,r:"Within limits, normal heat checking."},
  {t:"Gauges",n:"Brake chamber stroke",h:.3,r:"Normal on both sides."},
  {t:"Scan tool",n:"ABS codes",h:.2,r:"None."}],
 causes:["Worn rotors","Seized caliper guide pins on right side","Bad brake chamber","ABS valve fault"],c:1,
 fixes:[{n:"Replace rotors",p:600,h:3},{n:"Rebuild right caliper guide pins & boots, new pads both sides",p:350,h:2},{n:"Replace chamber",p:180,h:1},{n:"Replace ABS valve",p:250,h:1}],f:1,
 note:"A seized caliper only pushes one pad, so that side brakes weakly and the truck pulls the other way. Check slide on every pad job."},

{id:"B135",vm:"013",lvl:1,title:"Water in air tanks",unit:"2018 Mack Anthem · Wabco System Saver dryer",km:"620,000 km",book:1.1,
 complaint:"Drained tanks at the yard. Lots of water came out. Valves freezing up in winter.",
 tests:[
  {t:"Visual",n:"Drain each tank",h:.2,r:"Water in supply and both service tanks. No oil sheen."},
  {t:"Visual",n:"Dryer purge at cut-out",h:.1,r:"Purges normally at cut-out."},
  {t:"Visual",n:"Dryer cartridge service record",h:.1,r:"Cartridge last changed 3 years ago.",k:1},
  {t:"Multimeter",n:"Dryer heater (winter)",h:.2,r:"Heater works."},
  {t:"Visual",n:"Cut open old cartridge",h:.3,r:"Desiccant is saturated and clumped.",k:1}],
 causes:["Compressor passing oil","Dryer cartridge saturated (overdue)","Dryer heater failed","Purge valve stuck"],c:1,
 fixes:[{n:"Replace compressor",p:1650,h:4.5},{n:"Replace dryer cartridge, drain all tanks, recheck in a week",p:110,h:.6},{n:"Replace dryer heater",p:70,h:.6},{n:"Replace purge valve",p:90,h:.8}],f:1,
 note:"Purge and heater both worked, but the desiccant was full. Cartridges are a PM item. Change them on schedule or water gets to every valve."},

{id:"B136",vm:"013",lvl:2,title:"Air leak with brakes applied",unit:"2015 Peterbilt 579",km:"970,000 km",book:1.4,
 complaint:"Fails the applied leak test. Leak only when the brake pedal is pushed.",
 tests:[
  {t:"Gauges",n:"Applied leak test (tractor only)",h:.3,r:"6 psi/min. Limit for single vehicle is 3 psi/min."},
  {t:"Gauges",n:"Released leak test",h:.3,r:"1 psi/min. OK."},
  {t:"Visual",n:"Soap test with brakes applied",h:.4,r:"Bubbles from the exhaust port of the rear axle relay valve.",k:1},
  {t:"Visual",n:"Check chambers for diaphragm leak",h:.3,r:"No leak at chamber clamp rings or vents.",k:1},
  {t:"Visual",n:"Treadle valve exhaust",h:.2,r:"No leak."}],
 causes:["Leaking brake chamber diaphragm","Rear relay valve leaking through exhaust","Leaking foot (treadle) valve","Loose fitting"],c:1,
 fixes:[{n:"Replace brake chambers",p:360,h:2},{n:"Replace rear relay valve, retest applied leak",p:140,h:1},{n:"Replace treadle valve",p:260,h:1.5},{n:"Tighten fitting",p:0,h:.2}],f:1,
 note:"A leak only on application lives in the delivery side: chambers, relay valve, or treadle. Soap with brakes applied and listen at each exhaust."},

{id:"B137",vm:"013",lvl:2,title:"Pedal sinks, medium-duty",unit:"2017 Isuzu NRR · hydraulic brakes",km:"240,000 km",book:1.6,
 complaint:"Brake pedal slowly sinks to the floor when holding at a light.",
 tests:[
  {t:"Visual",n:"Fluid level & external leaks",h:.2,r:"Level full. No leaks at wheels, lines or calipers."},
  {t:"Gauges",n:"Hold steady pedal, engine running",h:.2,r:"Pedal creeps down slowly with steady force.",k:1},
  {t:"Gauges",n:"Clamp flex hoses one at a time",h:.4,r:"Pedal still sinks with all hoses clamped. Leak is before the hoses.",k:1},
  {t:"Visual",n:"Booster check",h:.3,r:"Booster assists normally."},
  {t:"Visual",n:"Brake pads",h:.3,r:"Plenty of material."}],
 causes:["Leaking caliper","Master cylinder bypassing internally","Air in lines","Bad brake booster"],c:1,
 fixes:[{n:"Replace calipers",p:450,h:2},{n:"Replace master cylinder, bench bleed, bleed system",p:280,h:1.4},{n:"Bleed brakes",p:20,h:.8},{n:"Replace booster",p:600,h:3}],f:1,
 note:"No external leak + fluid still full + slow sink = fluid getting past the master cylinder seals inside. Clamping hoses proved it's not the wheels."},
// ===== BATCH 2: ELECTRICAL =====
{id:"E321",vm:"032",lvl:1,title:"Click, no crank (truck)",unit:"2016 Freightliner Cascadia · Delco 39MT starter",km:"1,020,000 km",book:2.2,
 complaint:"Key to start, hear one click from under the truck. Batteries are new.",
 tests:[
  {t:"Multimeter",n:"Battery bank voltage",h:.1,r:"12.6 V. Charged."},
  {t:"Multimeter",n:"Voltage at starter B+ terminal while cranking",h:.2,r:"12.1 V. Power arriving at the starter."},
  {t:"Multimeter",n:"Voltage at solenoid S (control) terminal while cranking",h:.2,r:"11.9 V. Solenoid is being told to engage."},
  {t:"Multimeter",n:"Voltage at motor (M) terminal while cranking",h:.2,r:"0 V. Solenoid contacts aren't passing power to the motor.",k:1},
  {t:"Multimeter",n:"Voltage drop, ground side",h:.2,r:"0.1 V. Ground good."}],
 causes:["Weak batteries","Bad starter solenoid contacts","Bad ignition switch","Bad ground"],c:1,
 fixes:[{n:"Replace batteries",p:620,h:.8},{n:"Replace starter (or solenoid), retest crank voltage",p:450,h:1.8},{n:"Replace ignition switch",p:90,h:1},{n:"Replace ground cable",p:60,h:.6}],f:1,
 note:"Power in on B, signal in on S, but nothing out on M = the solenoid contacts. Testing each terminal tells you exactly where it stops."},

{id:"E322",vm:"032",lvl:1,title:"Slow crank when hot",unit:"2019 Mack Anthem · MP8",km:"470,000 km",book:1.2,
 complaint:"Cranks slow after the engine is hot. Cold starts are fine.",
 tests:[
  {t:"Multimeter",n:"Battery load test",h:.3,r:"All pass."},
  {t:"Multimeter",n:"Voltage drop positive cable while cranking",h:.2,r:"0.3 V. OK (under 0.5 V)."},
  {t:"Multimeter",n:"Voltage drop ground: battery − to engine block, cranking",h:.2,r:"1.3 V. Way too high.",k:1},
  {t:"Visual",n:"Engine-to-frame ground strap",h:.2,r:"Strap frayed and corroded under the clamp.",k:1},
  {t:"Multimeter",n:"Starter current draw",h:.3,r:"Within spec for this starter."}],
 causes:["Worn starter","Bad engine ground strap","Weak batteries","Bad positive cable"],c:1,
 fixes:[{n:"Replace starter",p:450,h:1.8},{n:"Replace ground strap, clean contact surfaces, retest drop",p:45,h:.6},{n:"Replace batteries",p:620,h:.8},{n:"Replace positive cable",p:80,h:1}],f:1,
 note:"The ground side carries the same current as the positive side. Always test both. Heat raises resistance, so a marginal ground shows up hot."},

{id:"E341",vm:"034",lvl:2,title:"Trailer marker fuse keeps blowing",unit:"2016 Utility 53' reefer",km:"n/a",book:1.8,
 complaint:"Marker and clearance lights work for a while, then the fuse blows. Worse on rough roads.",
 tests:[
  {t:"Multimeter",n:"Resistance brown (tail/marker) circuit to ground, lamps unplugged",h:.3,r:"0.4 Ω to ground. Should be open with lamps unplugged. Direct short.",k:1},
  {t:"Multimeter",n:"Unplug harness at mid-trailer junction, recheck",h:.4,r:"Front half: open (good). Rear half: still shorted.",k:1},
  {t:"Visual",n:"Inspect rear half harness",h:.4,r:"Harness rubbed through on a crossmember edge near the rear axle. Copper showing.",k:1},
  {t:"Multimeter",n:"Tractor 7-way brown pin output",h:.2,r:"Normal with trailer disconnected."},
  {t:"Visual",n:"Lamp sockets",h:.3,r:"No water or damage."}],
 causes:["Bad tractor relay","Shorted LED lamp","Harness chafed to ground at crossmember","Wrong fuse size"],c:2,
 fixes:[{n:"Replace tractor relay",p:25,h:.3},{n:"Replace all marker lamps",p:300,h:1.5},{n:"Repair chafed harness (solder, seal), add grommet/loom, secure",p:30,h:1},{n:"Install larger fuse",p:5,h:.1}],f:2,
 note:"Split the circuit in half and test each side. The short follows one half. Never 'fix' a short with a bigger fuse; that's how wiring fires start."},

{id:"E342",vm:"034",lvl:1,title:"Brake lights stay on",unit:"2018 International LT",km:"390,000 km",book:.8,
 complaint:"Brake lights stay on with nobody touching the pedal. Batteries draining.",
 tests:[
  {t:"Gauges",n:"Air pressure at stop light switch, pedal released",h:.2,r:"0 psi. No application air."},
  {t:"Multimeter",n:"Stop light switch continuity, no air",h:.2,r:"Closed. Should be open without air pressure.",k:1},
  {t:"Visual",n:"Treadle valve returns fully",h:.1,r:"Yes."},
  {t:"Scan tool",n:"Brake switch status in body controller",h:.2,r:"Shows 'applied' with pedal released."},
  {t:"Visual",n:"Stop lamp wiring",h:.2,r:"Normal, no shorts."}],
 causes:["Treadle valve stuck applied","Stop light switch stuck closed","Shorted wiring","Bad body controller"],c:1,
 fixes:[{n:"Replace treadle valve",p:260,h:1.5},{n:"Replace pneumatic stop light switch, verify",p:35,h:.4},{n:"Repair wiring",p:20,h:1},{n:"Replace body controller",p:1200,h:2}],f:1,
 note:"No air at the switch but it still reads closed = the switch. This is a classic battery drain too."},

{id:"E311",vm:"031",lvl:2,title:"Not charging at all",unit:"2017 Kenworth T680 · Delco 36SI",km:"760,000 km",book:1.3,
 complaint:"Voltmeter sits at 12.4 V running. Charge light on.",
 tests:[
  {t:"Multimeter",n:"Output at alternator, running",h:.2,r:"12.4 V. Not charging."},
  {t:"Multimeter",n:"Ignition/sense wire at alternator, key on",h:.2,r:"0 V. Should be battery voltage.",k:1},
  {t:"Visual",n:"Fuse for alternator ignition circuit",h:.2,r:"Fuse blown.",k:1},
  {t:"Multimeter",n:"Check for short on that circuit",h:.3,r:"No short now. Corroded connector likely spiked it once."},
  {t:"Visual",n:"Belt",h:.1,r:"Good."}],
 causes:["Failed alternator","Blown ignition/sense fuse, no turn-on signal","Bad belt","Bad batteries"],c:1,
 fixes:[{n:"Replace alternator",p:520,h:1.4},{n:"Replace fuse, clean/seal connector, verify 13.8–14.4 V",p:10,h:.5},{n:"Replace belt",p:60,h:.5},{n:"Replace batteries",p:620,h:.8}],f:1,
 note:"Some alternators need a turn-on signal. No signal, no charge, even with a perfect alternator. Check inputs before you condemn the part."},

{id:"I031",vm:"003",lvl:1,title:"Fuel gauge always on empty",unit:"2018 Peterbilt 567",km:"350,000 km",book:1.0,
 complaint:"Fuel gauge reads empty even with full tanks.",
 tests:[
  {t:"Multimeter",n:"Sender resistance at tank connector",h:.3,r:"OL (open). Should vary with fuel level.",k:1},
  {t:"Multimeter",n:"Short sender wire to ground at tank, watch gauge",h:.2,r:"Gauge swings to one end. Gauge and wiring work.",k:1},
  {t:"Multimeter",n:"Sender ground",h:.2,r:"Good."},
  {t:"Visual",n:"Tank level physically",h:.1,r:"Full."},
  {t:"Scan tool",n:"Cluster self-test",h:.2,r:"All gauges sweep."}],
 causes:["Bad fuel gauge","Failed fuel level sender","Broken wire","Bad cluster"],c:1,
 fixes:[{n:"Replace gauge",p:150,h:1},{n:"Replace sender, verify reading",p:120,h:1},{n:"Repair wire",p:10,h:.8},{n:"Replace cluster",p:900,h:1.5}],f:1,
 note:"Fake the sender signal at the tank. If the gauge moves, everything from there forward is fine, so the sender is the problem."},

{id:"I032",vm:"003",lvl:1,title:"Oil pressure gauge reads zero",unit:"2015 Kenworth W900 · Cummins ISX",km:"1,150,000 km",book:.9,
 complaint:"Oil pressure gauge dropped to zero on the highway. Engine sounds normal, no warning shutdown.",
 tests:[
  {t:"Gauges",n:"Install mechanical gauge",h:.3,r:"38 psi at idle warm. Real oil pressure is fine.",k:1},
  {t:"Scan tool",n:"Live data oil pressure",h:.2,r:"ECM shows oil pressure sensor out of range low.",k:1},
  {t:"Multimeter",n:"5 V reference at sensor",h:.2,r:"5.0 V. OK."},
  {t:"Multimeter",n:"Sensor signal",h:.2,r:"0 V. Sensor not responding."},
  {t:"Visual",n:"Oil level",h:.1,r:"Full."}],
 causes:["Bad oil pump","Failed oil pressure sensor","Low oil","Bad gauge cluster"],c:1,
 fixes:[{n:"Replace oil pump",p:900,h:6},{n:"Replace oil pressure sensor, clear code",p:110,h:.5},{n:"Add oil",p:30,h:.2},{n:"Replace cluster",p:900,h:1.5}],f:1,
 note:"Before you panic, verify with a mechanical gauge. Reference voltage good + no signal back = the sensor."},

{id:"E521",vm:"052",lvl:1,title:"Mirror heat blows fuse",unit:"2020 Volvo VNL 760",km:"280,000 km",book:1.2,
 complaint:"Turn on heated mirrors, fuse blows right away. Happened after the driver's door was replaced.",
 tests:[
  {t:"Multimeter",n:"Mirror heater circuit to ground",h:.2,r:"Short to ground on driver side only."},
  {t:"Visual",n:"Door hinge harness boot",h:.3,r:"Wire pinched between door and frame at the hinge from the door job.",k:1},
  {t:"Multimeter",n:"Mirror heater element resistance",h:.2,r:"About 8 Ω. Element is fine."},
  {t:"Multimeter",n:"Passenger side",h:.1,r:"Normal."},
  {t:"Visual",n:"Switch",h:.1,r:"Works."}],
 causes:["Bad mirror heater element","Wire pinched at door hinge","Bad switch","Wrong fuse"],c:1,
 fixes:[{n:"Replace mirror head",p:300,h:.8},{n:"Repair pinched wire, reroute through boot, new fuse",p:15,h:.8},{n:"Replace switch",p:50,h:.4},{n:"Bigger fuse",p:5,h:.1}],f:1,
 note:"Look at what was worked on last. A recent repair is the most likely cause of a new fault."},

{id:"P811",vm:"081",lvl:2,title:"APU won't start",unit:"2019 Freightliner · diesel APU",km:"n/a",book:1.5,
 complaint:"Sleeper APU cranks but won't start. No heat or A/C overnight.",
 tests:[
  {t:"Scan tool",n:"APU fault history",h:.2,r:"Last shutdown: low coolant level."},
  {t:"Visual",n:"APU coolant level",h:.1,r:"Low. Reservoir almost empty.",k:1},
  {t:"Visual",n:"Look for coolant leak",h:.3,r:"Hose clamp loose on APU heat-exchanger hose, dripping.",k:1},
  {t:"Gauges",n:"Fuel at APU fuel pump",h:.3,r:"Fuel delivered fine."},
  {t:"Multimeter",n:"Glow plug circuit",h:.2,r:"Glow plugs draw current."}],
 causes:["APU fuel pump failed","Low coolant shutdown from loose hose clamp","Glow plugs failed","APU starter bad"],c:1,
 fixes:[{n:"Replace fuel pump",p:150,h:1},{n:"Tighten/replace clamp, refill & bleed coolant, clear fault, run test",p:20,h:.7},{n:"Replace glow plugs",p:90,h:1},{n:"Replace starter",p:200,h:1}],f:1,
 note:"Read the shutdown history first. The APU told you why it quit. Then find what caused it."},
// ===== BATCH 3: ENGINE, FUEL, INTAKE, COOLING, AFTERTREATMENT =====
{id:"F441",vm:"044",lvl:1,title:"Loses power at full throttle",unit:"2018 Freightliner Cascadia · DD15",km:"510,000 km",book:1.2,
 complaint:"Pulls fine around town, falls on its face climbing loaded. No smoke.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.2,r:"Inactive: fuel pressure lower than expected under load."},
  {t:"Gauges",n:"Fuel suction restriction at full load",h:.4,r:"Well above max spec. Pump is pulling hard.",k:1},
  {t:"Visual",n:"Fuel filter service record",h:.1,r:"Filters 90,000 km overdue.",k:1},
  {t:"Gauges",n:"Air filter restriction",h:.1,r:"OK."},
  {t:"Visual",n:"Fuel tank pickup & vent",h:.3,r:"Vent clear, pickup screen clean."}],
 causes:["Failing injectors","Plugged fuel filters","Bad turbo","Blocked tank vent"],c:1,
 fixes:[{n:"Replace injectors",p:4000,h:8},{n:"Replace fuel filters, prime, road test under load",p:110,h:.7},{n:"Replace turbo",p:2800,h:5},{n:"Clear tank vent",p:0,h:.3}],f:1,
 note:"High suction restriction = something blocking fuel before the pump. Check the cheap PM item first."},

{id:"F442",vm:"044",lvl:2,title:"Hard start after sitting overnight",unit:"2016 Kenworth T680 · PACCAR MX-13",km:"840,000 km",book:1.4,
 complaint:"Long crank every morning. Starts right away if it's only been off an hour.",
 tests:[
  {t:"Visual",n:"Install clear line on fuel suction, crank",h:.4,r:"Lots of air bubbles in the suction line.",k:1},
  {t:"Visual",n:"Inspect suction side fittings",h:.4,r:"Cracked O-ring on fuel filter housing inlet fitting. Fuel drains back overnight.",k:1},
  {t:"Multimeter",n:"Battery & cranking speed",h:.2,r:"Normal."},
  {t:"Gauges",n:"Rail pressure during crank",h:.2,r:"Slow to build, then fine once primed."},
  {t:"Visual",n:"Check for fuel leaks on pressure side",h:.3,r:"Dry."}],
 causes:["Weak batteries","Air leak on suction side, fuel draining back","Bad injector","Faulty rail pressure sensor"],c:1,
 fixes:[{n:"Replace batteries",p:620,h:.8},{n:"Replace O-ring at filter housing inlet, prime, verify no bubbles",p:15,h:.6},{n:"Replace injector",p:700,h:3},{n:"Replace rail pressure sensor",p:250,h:.8}],f:1,
 note:"Suction side leaks often let air in instead of dripping fuel out. A clear hose shows you the bubbles."},

{id:"F443",vm:"044",lvl:1,title:"Cranks, won't start after filters",unit:"2019 Volvo VNL · D13",km:"420,000 km",book:.8,
 complaint:"Another tech did a PM and changed fuel filters. Now it won't start.",
 tests:[
  {t:"Gauges",n:"Rail pressure during crank",h:.2,r:"Almost zero.",k:1},
  {t:"Visual",n:"Filters & priming",h:.2,r:"Filters installed dry. System not primed.",k:1},
  {t:"Multimeter",n:"Battery",h:.1,r:"Good."},
  {t:"Scan tool",n:"Codes",h:.2,r:"Fuel pressure low during cranking."},
  {t:"Visual",n:"Filter part numbers",h:.1,r:"Correct parts."}],
 causes:["Failed high-pressure pump","Fuel system not primed after filter change","Wrong filters","Dead batteries"],c:1,
 fixes:[{n:"Replace HP pump",p:3000,h:6},{n:"Prime with hand primer / electric priming pump, then crank",p:0,h:.4},{n:"Replace filters",p:110,h:.5},{n:"Replace batteries",p:620,h:.8}],f:1,
 note:"Never crank a diesel to prime it. You cook the starter and starve the pump. Prime it the way the maker says."},

{id:"K421",vm:"042",lvl:1,title:"Heater cold, temp stays low",unit:"2017 Mack Pinnacle · MP8",km:"650,000 km",book:1.6,
 complaint:"Winter. Temp gauge barely gets off the bottom on the highway. Cab heat weak.",
 tests:[
  {t:"Scan tool",n:"Coolant temp on highway",h:.3,r:"65 °C. Should be around 85–95 °C.",k:1},
  {t:"Visual",n:"Upper rad hose temp right after cold start",h:.2,r:"Gets warm almost immediately. Coolant going to radiator too early.",k:1},
  {t:"Visual",n:"Fan clutch status",h:.2,r:"Fan disengaged. Not overcooling from the fan."},
  {t:"Visual",n:"Coolant level",h:.1,r:"Full."},
  {t:"Visual",n:"Winter front / shutters",h:.1,r:"Shutters closed properly."}],
 causes:["Fan stuck on","Thermostat stuck open","Low coolant","Bad temp sensor"],c:1,
 fixes:[{n:"Replace fan clutch",p:400,h:2},{n:"Replace thermostat(s) & seals",p:160,h:2},{n:"Add coolant",p:20,h:.2},{n:"Replace temp sensor",p:60,h:.4}],f:1,
 note:"Engine running cold hurts fuel economy, heat, and DPF regens. A thermostat stuck open lets coolant hit the radiator before the engine is warm."},

{id:"K422",vm:"042",lvl:1,title:"Coolant drip at front of engine",unit:"2015 International ProStar · MaxxForce",km:"900,000 km",book:2.8,
 complaint:"Pink crust and a coolant drip at the front of the engine. Topping up weekly.",
 tests:[
