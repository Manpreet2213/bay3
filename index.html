  {t:"Gauges",n:"Cooling system pressure test",h:.4,r:"Drops slowly. Drip appears at the water pump."},
  {t:"Visual",n:"Water pump weep hole",h:.2,r:"Coolant dripping from the weep hole. Pump seal failed.",k:1},
  {t:"Visual",n:"Pump shaft play",h:.2,r:"Slight wobble at the pulley.",k:1},
  {t:"Visual",n:"Hoses & clamps",h:.2,r:"Tight, no leaks."},
  {t:"Visual",n:"Oil for coolant",h:.1,r:"Clean."}],
 causes:["Leaking hose","Failed water pump seal & bearing","Head gasket","Radiator leak"],c:1,
 fixes:[{n:"Replace hoses",p:150,h:1},{n:"Replace water pump, refill, bleed, pressure test",p:400,h:2.4},{n:"Head gasket",p:1500,h:20},{n:"Replace radiator",p:1800,h:6}],f:1,
 note:"Coolant from the weep hole = the pump seal is done. Bearing play means it's close to failing completely."},

{id:"J411",vm:"041",lvl:2,title:"Blue smoke, turbo whine",unit:"2014 Peterbilt 587 · Cummins ISX",km:"1,300,000 km",book:5.5,
 complaint:"Blue smoke on acceleration. New loud whine. Using oil.",
 tests:[
  {t:"Visual",n:"Turbo shaft play by hand",h:.4,r:"Excessive play. Compressor wheel shows rub marks on the housing.",k:1},
  {t:"Visual",n:"Oil in intake piping after turbo",h:.3,r:"Oily film inside the boost pipe.",k:1},
  {t:"Visual",n:"Turbo oil drain line",h:.3,r:"Clear, not kinked."},
  {t:"Gauges",n:"Crankcase pressure",h:.3,r:"Normal."},
  {t:"Gauges",n:"Air filter restriction",h:.1,r:"OK."}],
 causes:["Worn piston rings","Turbo bearings failed, leaking oil","Plugged crankcase breather","Bad injectors"],c:1,
 fixes:[{n:"In-frame overhaul",p:12000,h:40},{n:"Replace turbo, clean CAC & pipes of oil, change oil",p:2800,h:5},{n:"Replace breather",p:120,h:.6},{n:"Replace injectors",p:4000,h:8}],f:1,
 note:"Before you bolt on a new turbo, check WHY the old one died: oil supply, drain, and crankcase pressure. Clean the oil out of the CAC too."},

{id:"J412",vm:"041",lvl:1,title:"Low power on a gravel-haul truck",unit:"2018 Western Star 4700 · gravel train",km:"300,000 km",book:.8,
 complaint:"Down on power, black smoke. Works in a dusty pit every day.",
 tests:[
  {t:"Gauges",n:"Air filter restriction gauge",h:.1,r:"In the red. Past max restriction.",k:1},
  {t:"Visual",n:"Filter element",h:.2,r:"Caked with dust.",k:1},
  {t:"Visual",n:"Intake piping after filter",h:.3,r:"Clean. No dust getting past the filter."},
  {t:"Gauges",n:"CAC leak test",h:.5,r:"Holds pressure."},
  {t:"Scan tool",n:"Codes",h:.2,r:"None active."}],
 causes:["Cracked CAC","Plugged air filter","Failed turbo","Bad fuel"],c:1,
 fixes:[{n:"Replace CAC",p:1300,h:2},{n:"Replace air filter (and safety element per schedule), reset indicator",p:120,h:.4},{n:"Replace turbo",p:2800,h:5},{n:"Drain fuel",p:0,h:1}],f:1,
 note:"Read the restriction gauge, not the calendar. Dusty jobs need filters far more often. Clean intake piping means no dust got through."},

{id:"Z431",vm:"043",lvl:2,title:"Emissions light in the cold",unit:"2020 Kenworth T680 · PACCAR MX-13",km:"260,000 km",book:1.6,
 complaint:"Every cold morning, emissions light comes on and truck warns of derate. Fine in summer.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.2,r:"DEF line heater circuit: open."},
  {t:"Multimeter",n:"DEF line heater resistance",h:.3,r:"Pressure line heater: OL. Other line heaters within spec.",k:1},
  {t:"Multimeter",n:"Heater relay output",h:.2,r:"Relay delivers 12 V when commanded.",k:1},
  {t:"Gauges",n:"DEF concentration",h:.2,r:"32.4 %. Good."},
  {t:"Visual",n:"DEF tank heater coolant valve",h:.3,r:"Works."}],
 causes:["Bad DEF quality","Open DEF pressure line heater","Failed DEF heater relay","Tank heater valve stuck"],c:1,
 fixes:[{n:"Drain & refill DEF",p:60,h:1},{n:"Replace DEF pressure line (heated), clear codes, verify",p:280,h:1.2},{n:"Replace relay",p:30,h:.3},{n:"Replace coolant valve",p:150,h:1}],f:1,
 note:"DEF freezes around −11 °C, so the lines are heated. Relay gave power, line was open, so the line heater is the fault."},

{id:"Z432",vm:"043",lvl:3,title:"SCR code, DEF tests good",unit:"2019 International LT · A26",km:"410,000 km",book:1.8,
 complaint:"Emissions light, SCR efficiency code again. Shop last month already flushed the DEF.",
 tests:[
  {t:"Gauges",n:"DEF concentration",h:.2,r:"32.6 %. Good."},
  {t:"Scan tool",n:"Live NOx inlet vs outlet on road test",h:.5,r:"Inlet changes with load. Outlet stuck at the same value no matter what.",k:1},
  {t:"Scan tool",n:"DEF dosing quantity test",h:.4,r:"Dosed amount matches commanded."},
  {t:"Visual",n:"Exhaust leaks near outlet NOx sensor",h:.3,r:"None."},
  {t:"Multimeter",n:"Outlet NOx sensor power & datalink",h:.3,r:"Power good, sensor communicating, but its reading is frozen.",k:1}],
 causes:["Bad DEF","Failed outlet NOx sensor","Plugged doser","SCR catalyst failed"],c:1,
 fixes:[{n:"Flush DEF again",p:60,h:1.3},{n:"Replace outlet NOx sensor, run SCR performance test",p:850,h:1},{n:"Replace doser",p:600,h:1.4},{n:"Replace SCR catalyst",p:5000,h:6}],f:1,
 note:"Same code as diluted DEF, different cause. A sensor that never changes is lying. Compare readings to each other and to load."},

{id:"Z433",vm:"043",lvl:1,title:"Ticking and soot on manifold",unit:"2016 Freightliner Columbia · DD13",km:"980,000 km",book:3.2,
 complaint:"Ticking that goes away once warm. Black soot streaks on the engine near the exhaust manifold.",
 tests:[
  {t:"Visual",n:"Inspect manifold & joints",h:.3,r:"Soot trails from between two manifold sections and from one gasket.",k:1},
  {t:"Visual",n:"Manifold studs",h:.4,r:"Two studs broken off.",k:1},
  {t:"Gauges",n:"Stethoscope",h:.2,r:"Tick loudest at the manifold."},
  {t:"Gauges",n:"Valve lash",h:.8,r:"In spec."},
  {t:"Scan tool",n:"Codes",h:.2,r:"None."}],
 causes:["Valves out of adjustment","Exhaust manifold leak (broken studs)","Injector noise","Turbo failure"],c:1,
 fixes:[{n:"Overhead adjustment",p:90,h:2.4},{n:"Extract broken studs, new studs & gaskets, torque to spec",p:150,h:2.8},{n:"Replace injector",p:700,h:3},{n:"Replace turbo",p:2800,h:5}],f:1,
 note:"Exhaust leaks tick when cold and seal up as metal grows. Soot trails show exactly where. Leaks before the turbo also cost boost."},

{id:"O451",vm:"045",lvl:2,title:"Engine brake weak on one setting",unit:"2017 Peterbilt 579 · Cummins X15",km:"640,000 km",book:1.6,
 complaint:"Jake works on Low but feels the same on Med and High.",
 tests:[
  {t:"Scan tool",n:"Engine brake switch inputs",h:.2,r:"Switch positions read correctly in the ECM."},
  {t:"Scan tool",n:"Engine brake output test",h:.3,r:"Commands go out to all solenoids."},
  {t:"Multimeter",n:"Resistance of engine brake solenoids",h:.5,r:"One solenoid OL. The other within spec.",k:1},
  {t:"Gauges",n:"Engine brake lash",h:.8,r:"In spec."},
  {t:"Gauges",n:"Oil pressure",h:.2,r:"Normal."}],
 causes:["Bad dash switch","Open engine brake solenoid","Engine brake lash out of spec","Low oil pressure"],c:1,
 fixes:[{n:"Replace switch",p:60,h:.5},{n:"Replace engine brake solenoid, test all steps",p:180,h:1.4},{n:"Adjust lash",p:0,h:1},{n:"Repair oil pressure",p:0,h:2}],f:1,
 note:"Engine brakes work in banks of cylinders. One dead solenoid = one bank missing, so two settings feel the same."},

{id:"G461",vm:"046",lvl:2,title:"EGR code, rough idle",unit:"2018 Volvo VNL · D13",km:"520,000 km",book:2.2,
 complaint:"Rough idle, check engine light, a bit of black smoke.",
 tests:[
  {t:"Scan tool",n:"Read codes",h:.2,r:"EGR valve position doesn't match commanded."},
  {t:"Scan tool",n:"EGR valve actuation test",h:.3,r:"Commanded 0 %, actual 22 %. Valve won't close fully.",k:1},
  {t:"Visual",n:"Remove & inspect EGR valve",h:.6,r:"Heavy carbon caking on valve and seat.",k:1},
  {t:"Multimeter",n:"EGR actuator power & signal",h:.3,r:"Good."},
  {t:"Gauges",n:"Boost",h:.3,r:"Normal."}],
 causes:["Bad ECM","EGR valve stuck partly open from carbon","Failed turbo","Bad injector"],c:1,
 fixes:[{n:"Replace ECM",p:2500,h:2},{n:"Replace (or clean if allowed) EGR valve, new gaskets, calibrate",p:900,h:1.8},{n:"Replace turbo",p:2800,h:5},{n:"Replace injector",p:700,h:3}],f:1,
 note:"An EGR valve stuck open at idle dumps exhaust into the intake: rough idle and smoke. Actuation test shows commanded vs actual."},

{id:"G462",vm:"046",lvl:1,title:"Oil seeping everywhere",unit:"2017 Kenworth T680 · PACCAR MX-13",km:"690,000 km",book:1.0,
 complaint:"New oil leaks at seals and the dipstick tube pushes oil. Engine runs normal.",
 tests:[
  {t:"Gauges",n:"Crankcase pressure",h:.3,r:"Well above spec.",k:1},
  {t:"Visual",n:"Crankcase ventilation filter service record",h:.1,r:"Never changed.",k:1},
  {t:"Visual",n:"Inspect CCV filter",h:.3,r:"Soaked and plugged with sludge."},
  {t:"Gauges",n:"Blow-by test with new filter",h:.4,r:"Pressure drops back to normal. Rings fine."},
  {t:"Visual",n:"Turbo play",h:.3,r:"Normal."}],
 causes:["Worn rings","Plugged crankcase ventilation filter","Bad turbo","Overfilled oil"],c:1,
 fixes:[{n:"In-frame overhaul",p:12000,h:40},{n:"Replace CCV filter, clean up leaks, recheck pressure",p:90,h:.6},{n:"Replace turbo",p:2800,h:5},{n:"Drain oil to level",p:0,h:.3}],f:1,
 note:"When crankcase pressure can't vent, it pushes oil out every seal. Rule out the cheap filter before blaming rings."},
// ===== BATCH 4: DRIVETRAIN & CHASSIS =====
{id:"D231",vm:"023",lvl:1,title:"Grinds going into gear at a stop",unit:"2017 Kenworth T800 · Eaton 13-speed",km:"560,000 km",book:.9,
 complaint:"Grinds every time going into 1st or reverse from a stop, even with the pedal on the floor.",
 tests:[
  {t:"Gauges",n:"Free pedal travel",h:.1,r:"3 in. Spec 1½–2 in. Too much.",k:1},
  {t:"Gauges",n:"Clutch brake squeeze at end of pedal",h:.2,r:"Release bearing never reaches the clutch brake.",k:1},
  {t:"Gauges",n:"Release bearing to clutch brake gap",h:.4,r:"¾ in. Spec ½–9⁄16 in."},
  {t:"Visual",n:"Clutch brake condition",h:.3,r:"Clutch brake looks OK."},
  {t:"Visual",n:"Linkage bushings",h:.3,r:"Some wear, within limits."}],
 causes:["Worn clutch disc","External linkage out of adjustment, clutch brake not engaging","Worn synchros","Bad clutch brake"],c:1,
 fixes:[{n:"Replace clutch",p:1800,h:10},{n:"Adjust external linkage to spec free pedal, verify clutch brake squeeze",p:0,h:.6},{n:"Rebuild transmission",p:3500,h:16},{n:"Replace clutch brake",p:90,h:3}],f:1,
 note:"The clutch brake stops the input shaft so gears can mesh at a stop. Too much free pedal and the bearing never reaches it. Never use it while moving."},

{id:"D232",vm:"023",lvl:3,title:"Clutch chatters on take-off",unit:"2014 Mack Pinnacle · MP8",km:"1,090,000 km",book:11,
 complaint:"Shudders and chatters pulling away loaded. Got worse quickly.",
 tests:[
  {t:"Gauges",n:"Free pedal & bearing gap",h:.4,r:"Both in spec."},
  {t:"Visual",n:"Inspection cover on bell housing",h:.4,r:"Oil inside the bell housing.",k:1},
  {t:"Visual",n:"Source of oil",h:.6,r:"Rear main seal leaking engine oil.",k:1},
  {t:"Visual",n:"Engine & trans mounts",h:.3,r:"OK."},
  {t:"Visual",n:"U-joints",h:.2,r:"OK."}],
 causes:["Clutch out of adjustment","Oil-soaked clutch from leaking rear main seal","Broken mounts","Worn U-joints"],c:1,
 fixes:[{n:"Adjust clutch",p:0,h:1.3},{n:"Pull trans, replace rear main seal & clutch, inspect flywheel",p:2200,h:10},{n:"Replace mounts",p:400,h:3},{n:"Replace U-joints",p:180,h:2}],f:1,
 note:"Oil on a clutch can't be cleaned off. Fix the leak AND replace the clutch, or you're back in a month."},

{id:"V241",vm:"024",lvl:1,title:"Rumble from under the cab",unit:"2019 International LT · 3-piece driveline",km:"410,000 km",book:1.6,
 complaint:"Rumble/growl under the cab at highway speed. Gets worse accelerating.",
 tests:[
  {t:"Visual",n:"Center bearing rubber & bearing",h:.3,r:"Rubber cushion torn. Bearing rough when spun.",k:1},
  {t:"Visual",n:"U-joints",h:.3,r:"Tight, all purging grease."},
  {t:"Visual",n:"Driveshaft balance weights",h:.1,r:"All present."},
  {t:"Visual",n:"Slip yoke",h:.2,r:"Greased, no excess play."},
  {t:"Visual",n:"Center bearing bracket bolts",h:.1,r:"Tight."}],
 causes:["Worn U-joint","Failed center bearing","Missing balance weight","Dry slip yoke"],c:1,
 fixes:[{n:"Replace U-joint",p:90,h:1},{n:"Replace center bearing, verify phasing on reassembly",p:150,h:1.4},{n:"Balance driveshaft",p:150,h:2},{n:"Grease slip yoke",p:0,h:.2}],f:1,
 note:"Mark the shaft before you pull it apart. Reassembled out of phase, it vibrates even with new parts."},

{id:"G261",vm:"026",lvl:2,title:"Automatic slips between gears",unit:"2016 Freightliner M2 · Allison 3000",km:"280,000 km",book:1.2,
 complaint:"Box truck flares RPM on the 2–3 shift. Started recently.",
 tests:[
  {t:"Scan tool",n:"Transmission codes",h:.2,r:"Inactive: gear ratio fault 2nd–3rd."},
  {t:"Gauges",n:"Check fluid level (hot, via shift selector or dipstick)",h:.3,r:"Low, about 2 L down.",k:1},
  {t:"Visual",n:"Leak check",h:.3,r:"Cooler line fitting seeping.",k:1},
  {t:"Visual",n:"Fluid condition",h:.2,r:"Red, no burnt smell."},
  {t:"Scan tool",n:"Clutch pressure test",h:.6,r:"Low pressure in 3rd at low fluid level."}],
 causes:["Worn internal clutches","Low fluid from leaking cooler line","Bad solenoid","Bad TCM"],c:1,
 fixes:[{n:"Rebuild transmission",p:5000,h:20},{n:"Repair cooler line fitting, top up correct fluid, verify level hot",p:40,h:.8},{n:"Replace solenoid",p:300,h:2},{n:"Replace TCM",p:1500,h:1.5}],f:1,
 note:"Check fluid first. Low fluid lets air into the pump and pressure drops, so clutches slip. Catch it early and nothing is damaged."},

{id:"G262",vm:"026",lvl:2,title:"Jumps out of gear",unit:"2013 Kenworth W900 · Eaton 18-speed",km:"1,400,000 km",book:2.6,
 complaint:"Pops out of gear when coming off throttle going downhill.",
 tests:[
  {t:"Visual",n:"Engine & transmission mounts under load",h:.4,r:"Rear trans mount rubber split. Drivetrain shifts when going on/off throttle.",k:1},
  {t:"Visual",n:"Shift lever & tower",h:.3,r:"Shift lever moves a lot when the engine twists.",k:1},
  {t:"Gauges",n:"Driveline angles",h:.6,r:"In spec."},
  {t:"Visual",n:"Driver habits",h:.1,r:"No heavy bag hanging on the shifter."},
  {t:"Visual",n:"Transmission oil",h:.2,r:"Clean, full."}],
 causes:["Worn gear teeth","Broken mounts letting the drivetrain move","Wrong oil","Bad clutch"],c:1,
 fixes:[{n:"Rebuild transmission",p:3500,h:16},{n:"Replace engine/trans mounts, road test",p:400,h:2.4},{n:"Change oil",p:150,h:.5},{n:"Replace clutch",p:1800,h:10}],f:1,
 note:"If the engine twists on bad mounts, it yanks the shift lever and pulls the gear out. Check mounts before opening the transmission."},

{id:"Q221",vm:"022",lvl:2,title:"Diff lock won't engage",unit:"2018 Western Star 4700 · tandem drive",km:"330,000 km",book:1.4,
 complaint:"Inter-axle diff lock switch does nothing. Getting stuck in the pit.",
 tests:[
  {t:"Visual",n:"Indicator light with switch on",h:.1,r:"Light doesn't come on."},
  {t:"Gauges",n:"Air at the lockout shift cylinder, switch on",h:.3,r:"Full air arriving."},
  {t:"Visual",n:"Soap test shift cylinder",h:.3,r:"Air blowing past the cylinder piston seal.",k:1},
  {t:"Visual",n:"Shift fork movement (by hand)",h:.4,r:"Fork moves freely."},
  {t:"Multimeter",n:"Indicator switch",h:.2,r:"Works when fork is pushed in by hand.",k:1}],
 causes:["Bad dash switch","Leaking lockout shift cylinder","Broken shift fork","No air to the cylinder"],c:1,
 fixes:[{n:"Replace switch",p:50,h:.5},{n:"Rebuild/replace lockout shift cylinder, test engage",p:140,h:1.2},{n:"Replace shift fork",p:200,h:4},{n:"Repair air line",p:30,h:.5}],f:1,
 note:"Engage the inter-axle lock only when stopped or creeping straight, never when wheels are spinning."},

{id:"Q222",vm:"022",lvl:1,title:"Oil on drive brakes",unit:"2017 Freightliner Cascadia",km:"590,000 km",book:2.6,
 complaint:"Oily mess on the inside of a drive wheel. Brakes on that side feel weak.",
 tests:[
  {t:"Visual",n:"Hub & axle flange",h:.2,r:"Gear oil running down from inside the hub."},
  {t:"Visual",n:"Pull drum, inspect wheel seal",h:.6,r:"Wheel seal leaking. Shoes soaked with gear oil.",k:1},
  {t:"Visual",n:"Axle vent",h:.1,r:"Vent plugged with dirt.",k:1},
  {t:"Gauges",n:"Wheel end play",h:.3,r:"Within spec."},
  {t:"Visual",n:"Axle flange gasket",h:.2,r:"Dry."}],
 causes:["Leaking axle flange gasket","Wheel seal leaking (vent plugged)","Overfilled axle","Cracked hub"],c:1,
 fixes:[{n:"Replace flange gasket",p:15,h:.6},{n:"New wheel seal, clean/replace vent, replace shoes (axle set), refill",p:330,h:2.4},{n:"Drain to level",p:0,h:.3},{n:"Replace hub",p:500,h:3}],f:1,
 note:"A plugged axle vent builds pressure and pushes oil past the seal. Change the seal AND clear the vent."},

{id:"X111",vm:"011",lvl:2,title:"Steer wanders, clunk turning",unit:"2012 Peterbilt 388",km:"1,350,000 km",book:6.5,
 complaint:"Wanders on the highway. Clunk in sharp turns.",
 tests:[
  {t:"Gauges",n:"Kingpin upper/lower play, dial indicator",h:.5,r:"Lower bushing play well over limit.",k:1},
  {t:"Gauges",n:"Kingpin vertical play",h:.3,r:"Over limit.",k:1},
  {t:"Visual",n:"Tie rod ends",h:.2,r:"Tight."},
  {t:"Gauges",n:"Wheel end play",h:.4,r:"In spec."},
  {t:"Visual",n:"Steering gear lash",h:.3,r:"In spec."}],
 causes:["Wheel bearings loose","Worn kingpins and bushings","Worn tie rod ends","Bad steering gear"],c:1,
 fixes:[{n:"Adjust wheel bearings",p:0,h:1},{n:"Kingpin job both sides, ream bushings, align",p:600,h:6},{n:"Replace tie rods",p:260,h:2},{n:"Replace steering gear",p:1500,h:4}],f:1,
 note:"Check kingpins with the front end lifted so weight is off. Grease kingpins at every PM to make them last."},

{id:"S151",vm:"015",lvl:2,title:"Hard steering at low speed",unit:"2016 Mack Granite",km:"470,000 km",book:2.4,
 complaint:"Hard to turn the wheel at slow speed, especially parking. Gets easier with more RPM.",
 tests:[
  {t:"Visual",n:"Power steering fluid level & condition",h:.1,r:"Full, clean."},
  {t:"Gauges",n:"PS pump flow & pressure test",h:.6,r:"Flow low at idle. Relief pressure low.",k:1},
  {t:"Visual",n:"Pump drive & belt",h:.2,r:"Gear-driven, OK."},
  {t:"Gauges",n:"Gear internal leak test (flow meter, gear at stop)",h:.5,r:"Gear holds pressure. Not leaking internally.",k:1},
  {t:"Visual",n:"Front end dry park check",h:.3,r:"Joints and kingpins OK."}],
 causes:["Bad steering gear","Worn power steering pump","Low fluid","Tight kingpins"],c:1,
 fixes:[{n:"Replace steering gear",p:1500,h:4},{n:"Replace PS pump, flush, bleed",p:650,h:2},{n:"Add fluid",p:20,h:.2},{n:"Grease kingpins",p:0,h:.4}],f:1,
 note:"A flow meter splits the problem: pump flow low but gear holds pressure = pump. Easier at high RPM is the classic weak-pump sign."},

{id:"S152",vm:"015",lvl:1,title:"Loose steering, shimmy",unit:"2018 Volvo VNL",km:"500,000 km",book:1.4,
 complaint:"Steering feels loose, slight shimmy after hitting bumps.",
 tests:[
  {t:"Visual",n:"Dry park check (rock wheel, watch joints)",h:.3,r:"Drag link lower ball joint has play.",k:1},
  {t:"Visual",n:"Tie rod ends",h:.2,r:"Tight."},
  {t:"Gauges",n:"Kingpin play",h:.4,r:"In spec."},
  {t:"Visual",n:"Steering gear mounting",h:.2,r:"Tight."},
  {t:"Gauges",n:"Tire balance",h:.4,r:"OK."}],
 causes:["Worn kingpins","Worn drag link end","Loose gear mount","Unbalanced tire"],c:1,
 fixes:[{n:"Kingpin job",p:600,h:6},{n:"Replace drag link (end), center steering wheel, check toe",p:180,h:1.2},{n:"Torque gear mount",p:0,h:.4},{n:"Balance tire",p:30,h:.5}],f:1,
 note:"Dry park: engine running, wheels on the ground, someone rocks the wheel while you watch every joint. Movement you can see is the worn part."},

{id:"U161",vm:"016",lvl:1,title:"Truck leans, rear sags",unit:"2015 Kenworth T800 · leaf spring suspension",km:"700,000 km",book:2.6,
 complaint:"Driver side rear sits lower. Heard a bang on a bad road.",
 tests:[
  {t:"Visual",n:"Spring packs",h:.3,r:"Main leaf broken on driver side rear spring.",k:1},
  {t:"Visual",n:"Center bolt & U-bolts",h:.3,r:"U-bolts loose on that pack.",k:1},
  {t:"Visual",n:"Spring hangers",h:.2,r:"OK."},
  {t:"Visual",n:"Frame",h:.3,r:"No cracks."},
  {t:"Gauges",n:"Tire pressure",h:.1,r:"OK."}],
 causes:["Low tire","Broken main leaf (loose U-bolts)","Cracked frame","Worn hanger"],c:1,
 fixes:[{n:"Air up tire",p:0,h:.2},{n:"Replace spring pack, new U-bolts, torque & retorque",p:450,h:2.4},{n:"Repair frame",p:380,h:6},{n:"Replace hanger",p:150,h:2}],f:1,
 note:"Loose U-bolts let leaves shift and snap. Always use new U-bolts and retorque after a short run."},

{id:"U162",vm:"016",lvl:2,title:"Truck dog-tracks",unit:"2019 Mack Anthem · tandem air ride",km:"380,000 km",book:2.0,
 complaint:"Truck runs crooked down the road. Steering wheel off center going straight.",
 tests:[
  {t:"Gauges",n:"Drive axle alignment (thrust & scrub)",h:.8,r:"Rear drive axle out of parallel.",k:1},
  {t:"Visual",n:"Torque rod bushings",h:.4,r:"Rear torque rod bushing split. Axle can shift.",k:1},
  {t:"Visual",n:"Steer axle toe",h:.4,r:"In spec."},
  {t:"Visual",n:"Spring/air bag mounts",h:.3,r:"OK."},
  {t:"Gauges",n:"Tire sizes",h:.2,r:"Matched."}],
 causes:["Steer toe wrong","Worn torque rod bushing letting axle walk","Bent frame","Tire mismatch"],c:1,
 fixes:[{n:"Set toe",p:0,h:1},{n:"Replace torque rod (bushings), align drive axles",p:220,h:1.6},{n:"Straighten frame",p:0,h:20},{n:"Replace tires",p:900,h:1}],f:1,
 note:"Torque rods locate the axle. A worn bushing lets it move, so the axles steer the truck. Fix parts, then align."},

{id:"U163",vm:"016",lvl:1,title:"Cupped steer tires",unit:"2017 Freightliner Cascadia",km:"610,000 km",book:1.2,
 complaint:"Steer tires wearing in scalloped dips around the tread. Bouncy ride.",
 tests:[
  {t:"Visual",n:"Tire wear pattern",h:.1,r:"Cupping/scalloping on both steer tires."},
  {t:"Visual",n:"Shock absorbers",h:.2,r:"Both front shocks leaking oil, weak when cycled by hand.",k:1},
  {t:"Gauges",n:"Bounce test",h:.1,r:"Front keeps bouncing after you push down.",k:1},
  {t:"Gauges",n:"Wheel end play",h:.3,r:"In spec."},
  {t:"Gauges",n:"Toe",h:.4,r:"In spec."}],
 causes:["Toe out of spec","Worn front shocks","Loose wheel bearings","Low tire pressure"],c:1,
 fixes:[{n:"Align",p:0,h:1},{n:"Replace front shocks, recommend tire rotate/replace",p:160,h:1},{n:"Adjust bearings",p:0,h:1},{n:"Inflate",p:0,h:.2}],f:1,
 note:"Weak shocks let the tire bounce, and each landing scrubs a patch. Wet, oily shocks = they've lost fluid."},

{id:"W181",vm:"018",lvl:2,title:"Trailer hub too hot",unit:"2016 Great Dane 53' · oil-bath hubs",km:"n/a",book:2.4,
 complaint:"Driver smelled hot oil. One trailer hub too hot to touch after a run.",
 tests:[
  {t:"Gauges",n:"Infrared temp all hubs after run",h:.2,r:"Left rear hub far hotter than the others."},
  {t:"Visual",n:"Hub oil level",h:.1,r:"Almost empty. Oil spray on the inside of the wheel.",k:1},
  {t:"Gauges",n:"Wheel end play",h:.3,r:"Too tight: no measurable end play.",k:1},
  {t:"Visual",n:"Brake drag (spin wheel released)",h:.2,r:"Spins freely, brakes not dragging."},
  {t:"Visual",n:"Bearings after teardown",h:.6,r:"Bearings discoloured from heat."}],
 causes:["Brake dragging","Over-tightened bearing adjustment and lost oil","Bad tire","Cracked drum"],c:1,
 fixes:[{n:"Adjust brakes",p:0,h:.5},{n:"Replace bearings, races & seal, adjust end play per RP 618, refill",p:280,h:2},{n:"Replace tire",p:450,h:.6},{n:"Replace drum",p:260,h:2}],f:1,
 note:"Zero end play = preload, which cooks bearings. Brakes released and spinning free means the heat was coming from the bearing, not the brakes."},

{id:"R171",vm:"017",lvl:1,title:"Bulge on steer tire sidewall",unit:"2020 Kenworth T680",km:"220,000 km",book:.7,
 complaint:"Annual inspection: bulge on the outside wall of the right steer tire.",
 tests:[
  {t:"Visual",n:"Inspect bulge",h:.1,r:"Bulge on sidewall, about the size of a fist. Cords broken under it.",k:1},
  {t:"Gauges",n:"Tread depth",h:.1,r:"10/32. Plenty of tread."},
  {t:"Gauges",n:"Pressure",h:.1,r:"Correct."},
  {t:"Visual",n:"Rim lip",h:.1,r:"Small dent from a curb hit.",k:1},
  {t:"Visual",n:"Other tires",h:.2,r:"OK."}],
 causes:["Low pressure","Sidewall damage from impact (broken cords)","Worn out tread","Wrong tire size"],c:1,
 fixes:[{n:"Inflate & monitor",p:0,h:.1},{n:"Replace tire, inspect/replace dented wheel, torque",p:600,h:.6},{n:"Retread",p:250,h:.5},{n:"Swap position",p:0,h:.4}],f:1,
 note:"A sidewall bulge means broken cords. It's out-of-service on a steer axle. Don't send it out because there's tread left."},
// ===== BATCH 5: CAB, HVAC, COUPLING, TRAILER, REEFER =====
{id:"H011",vm:"001",lvl:1,title:"Blower only works on high",unit:"2018 International LT",km:"440,000 km",book:.8,
 complaint:"Fan only blows on the highest setting. Other speeds dead.",
 tests:[
  {t:"Multimeter",n:"Voltage at blower motor, each speed",h:.2,r:"0 V on speeds 1–3, 12.4 V on high."},
  {t:"Multimeter",n:"Blower resistor pack resistance",h:.2,r:"Open between terminals. Thermal fuse blown.",k:1},
  {t:"Multimeter",n:"Blower motor current on high",h:.2,r:"Normal draw. Motor isn't overloading."},
  {t:"Visual",n:"Switch",h:.2,r:"Switch sends signal on all speeds."},
  {t:"Visual",n:"Blower intake for debris",h:.2,r:"Some leaves. Cleared."}],
 causes:["Bad blower motor","Failed blower resistor","Bad switch","Blown fuse"],c:1,
 fixes:[{n:"Replace blower motor",p:180,h:1.2},{n:"Replace blower resistor, clear debris, test all speeds",p:45,h:.5},{n:"Replace switch",p:60,h:.6},{n:"Replace fuse",p:5,h:.1}],f:1,
 note:"High speed skips the resistor and goes straight to the motor. So 'only high works' points at the resistor."},

{id:"H012",vm:"001",lvl:2,title:"Heater blows cold",unit:"2017 Freightliner Cascadia",km:"600,000 km",book:1.2,
 complaint:"Engine fully warm but cab heat is cold. A/C works.",
 tests:[
  {t:"Scan tool",n:"Engine coolant temp",h:.1,r:"88 °C. Engine is warm."},
  {t:"Visual",n:"Feel heater hoses at the firewall",h:.2,r:"Inlet hot, outlet cold.",k:1},
  {t:"Gauges",n:"Heater coolant valve with heat commanded",h:.3,r:"Air-operated heater valve stays closed. Air signal present.",k:1},
  {t:"Visual",n:"Blend door movement",h:.3,r:"Moves full range."},
  {t:"Visual",n:"Coolant level",h:.1,r:"Full."}],
 causes:["Low coolant","Heater control valve stuck closed","Blend door stuck","Plugged heater core"],c:1,
 fixes:[{n:"Add coolant",p:20,h:.2},{n:"Replace heater control valve, bleed air, verify heat",p:130,h:1},{n:"Replace blend door actuator",p:120,h:1},{n:"Replace heater core",p:400,h:6}],f:1,
 note:"Hot in, cold out = coolant isn't flowing through. The valve got its signal and still didn't open, so it's the valve. A plugged core would warm up a little."},

{id:"B021",vm:"002",lvl:1,title:"Wipers stop wherever",unit:"2019 Peterbilt 579",km:"300,000 km",book:.9,
 complaint:"Wipers work but stop in the middle of the windshield when switched off.",
 tests:[
  {t:"Multimeter",n:"Constant 12 V at wiper motor park circuit",h:.2,r:"12.3 V present."},
  {t:"Multimeter",n:"Park switch output as motor turns",h:.3,r:"Never changes state. Park switch inside motor stuck.",k:1},
  {t:"Visual",n:"Linkage",h:.3,r:"Moves freely."},
  {t:"Multimeter",n:"Wiper switch outputs",h:.2,r:"All speeds correct."},
  {t:"Visual",n:"Arm nuts",h:.1,r:"Tight."}],
 causes:["Bad wiper switch","Wiper motor park switch failed","Loose linkage","No park power"],c:1,
 fixes:[{n:"Replace switch",p:80,h:.6},{n:"Replace wiper motor, set arm position",p:220,h:1},{n:"Repair linkage",p:60,h:1},{n:"Repair power feed",p:10,h:.5}],f:1,
 note:"The park switch keeps the motor running until the arms are down. With power present and a dead switch signal, the motor is the fault."},

{id:"C591",vm:"059",lvl:1,title:"Air hissing at the gladhands",unit:"2018 Volvo VNL + 53' van",km:"n/a",book:.4,
 complaint:"Hiss at the back of the cab after hooking up. Air pressure drops while parked.",
 tests:[
  {t:"Visual",n:"Listen & soap gladhands",h:.1,r:"Leak at the red (emergency) gladhand.",k:1},
  {t:"Visual",n:"Gladhand seal",h:.1,r:"Rubber seal cracked and flattened.",k:1},
  {t:"Gauges",n:"Released leak test",h:.3,r:"4 psi/min. Over limit."},
  {t:"Visual",n:"Air lines",h:.2,r:"No chafing."},
  {t:"Visual",n:"Trailer side lines",h:.2,r:"No leaks."}],
 causes:["Leaking trailer tank","Worn gladhand seal","Bad tractor protection valve","Chafed air line"],c:1,
 fixes:[{n:"Replace trailer tank",p:200,h:2},{n:"Replace gladhand seals (both), retest leak",p:6,h:.2},{n:"Replace TP valve",p:180,h:1},{n:"Replace line",p:60,h:.6}],f:1,
 note:"Cheapest repair in the shop. Carry spare gladhand seals. A hiss at the coupling is almost always the seal."},

{id:"C592",vm:"059",lvl:2,title:"Trailer clunk, lock adjusted fine",unit:"2015 Manac flatbed · kingpin",km:"n/a",book:4.5,
 complaint:"Still clunks on take-off. Tractor fifth wheel lock was just checked and adjusted.",
 tests:[
  {t:"Gauges",n:"Kingpin wear gauge",h:.2,r:"Kingpin worn below minimum diameter.",k:1},
  {t:"Visual",n:"Kingpin for bends/cracks",h:.2,r:"Worn on one side from no grease.",k:1},
  {t:"Gauges",n:"Fifth wheel lock adjustment",h:.3,r:"In spec."},
  {t:"Visual",n:"Upper coupler plate",h:.3,r:"Flat, no cracks."},
  {t:"Visual",n:"Fifth wheel mounts",h:.2,r:"Tight."}],
 causes:["Fifth wheel lock loose","Worn trailer kingpin","Cracked upper coupler","Loose fifth wheel mounts"],c:1,
 fixes:[{n:"Adjust lock",p:0,h:.7},{n:"Replace kingpin per trailer maker procedure",p:300,h:4},{n:"Repair upper coupler",p:1200,h:10},{n:"Torque mounts",p:0,h:.5}],f:1,
 note:"Slack can come from either side. Tractor checked good, so measure the trailer kingpin with a gauge."},

{id:"T691",vm:"069",lvl:2,title:"Reefer won't start in the cold",unit:"2019 53' reefer · diesel TRU",km:"n/a",book:1.3,
 complaint:"Unit cranks but won't start on cold mornings. Starts once it's been running.",
 tests:[
  {t:"Scan tool",n:"Unit alarms",h:.2,r:"Failed to start."},
  {t:"Multimeter",n:"Glow plug current draw",h:.3,r:"Lower than spec. Two of three plugs not drawing.",k:1},
  {t:"Multimeter",n:"Individual glow plug resistance",h:.3,r:"Two plugs OL.",k:1},
  {t:"Gauges",n:"Fuel at injection pump",h:.3,r:"Good."},
  {t:"Multimeter",n:"Battery",h:.2,r:"12.6 V, passes load test."}],
 causes:["Weak battery","Failed glow plugs","No fuel","Bad starter"],c:1,
 fixes:[{n:"Replace battery",p:200,h:.4},{n:"Replace glow plugs, test pre-heat current",p:90,h:1},{n:"Prime fuel",p:0,h:.4},{n:"Replace starter",p:300,h:1.5}],f:1,
 note:"Small diesels need glow plugs to start cold. Checking current draw finds dead plugs fast, then confirm with resistance."},

{id:"L551",vm:"055",lvl:1,title:"Liftgate won't come down",unit:"2016 24' straight truck · hydraulic liftgate",km:"310,000 km",book:.9,
 complaint:"Gate goes up fine but won't lower. Stuck at deck height.",
 tests:[
  {t:"Multimeter",n:"Voltage at lowering valve with DOWN pressed",h:.2,r:"12.3 V. Signal is there."},
  {t:"Multimeter",n:"Lowering valve coil resistance",h:.2,r:"OL. Coil open.",k:1},
  {t:"Visual",n:"Hydraulic fluid level",h:.1,r:"Full."},
  {t:"Visual",n:"Control switch",h:.1,r:"Works."},
  {t:"Visual",n:"Mechanical binding",h:.3,r:"None."}],
 causes:["Bad switch","Open lowering valve solenoid coil","Low fluid","Bent gate arm"],c:1,
 fixes:[{n:"Replace switch",p:80,h:.4},{n:"Replace lowering valve coil, cycle gate",p:70,h:.6},{n:"Add fluid",p:20,h:.2},{n:"Straighten arm",p:0,h:3}],f:1,
 note:"Lifting uses the motor, lowering uses a valve. Signal in, open coil = the coil. Same split-test logic as everything else."},

const B=(t,flow,pts,specs,q,o,a,why)=>({t,flow,pts,specs,q,o,a,why});
const BRIEF={
"001":B("Heating & A/C",["Compressor","Condenser","Receiver-drier","Expansion valve","Evaporator"],
 ["Refrigerant picks up cab heat in the evaporator and gets rid of it at the condenser out front.","High side (red gauge) is hot, high pressure. Low side (blue gauge) is cold, low pressure.","Both sides low + clutch cycling fast = low charge. High pressure + poor cooling = condenser can't shed heat.","Cab heat is engine coolant flowing through the heater core. A valve and blend door control it.","Blower speeds below HIGH run through a resistor. Only high works = resistor."],
 [["Refrigerant work","ODP card required in Ontario"],["Charge","By weight, from the OEM label"]],
 "Both A/C gauges read low and the compressor clutch clicks on and off. Most likely?",["System overcharged","Low refrigerant charge","Blend door stuck on heat"],1,"Low charge drops both sides, and the low-pressure switch keeps cutting the clutch out."),
"002":B("Cab & body",["Air supply","Cab height valve","Cab air springs","Shocks"],
 ["Many sleeper cabs float on air springs with their own height valve, like the chassis suspension.","A slow leak shows up after sitting overnight. Soap every bag and fitting.","Wipers have a park switch inside the motor that keeps them going until the arms are down.","Doors, mirrors, wipers: check power, then ground, then the part."],
 [],"Cab sits low only after sitting overnight. First thing to do?",["Soap test the cab air springs and fittings","Replace the height valve","Replace the cab shocks"],0,"A slow leak is the usual cause. Find it before you buy a valve."),
"003":B("Instruments & gauges",["Sensor","Module (ECM)","J1939 data bus","Cluster gauge"],
 ["Most gauges no longer wire straight to a sensor. The ECM reads the sensor and sends the value over the data bus.","A wrong gauge can be the sensor, the module reading it, the network, or the cluster.","Prove the real value first: a mechanical gauge for oil pressure, a test gauge for air.","Fuel senders change resistance as the float moves. Open sender = gauge pinned at one end.","Vehicle speed comes from a magnetic sensor on the transmission output shaft."],
 [],"Oil pressure gauge drops to zero but the engine sounds fine. First step?",["Hook up a mechanical gauge","Shut it down and pull the oil pan","Replace the cluster"],0,"Verify the real pressure before tearing anything apart."),
"011":B("Steer axle & wheel ends",["Spindle","Inner bearing","Hub","Outer bearing","Adjusting nut + lock"],
 ["Hubs ride on tapered roller bearings, lubed by oil or grease, sealed on the inside.","Bearing adjustment sets end play. Too loose: hub wobbles and kills the seal. Too tight (preload): bearing overheats.","Measure end play with a dial indicator on the hub, pushing and pulling the wheel.","Kingpins let the knuckle pivot. Check their play with the weight off the tires.","Oil or grease on brake linings means the linings are scrap. Replace the whole axle set."],
 [["Wheel end play","0.001–0.005 in (TMC RP 618)"]],
 "Dial indicator shows zero end play after you adjusted a hub. That means:",["Perfect adjustment","Bearing is preloaded, readjust","Normal for new bearings"],1,"Zero movement means the bearing is squeezed. It will run hot. You want a small amount of end play."),
"013":B("Air brakes",["Compressor","Governor","Air dryer","Supply tank","Primary & secondary tanks","Foot valve","Relay valves","Chambers","Slack adjusters","S-cam & shoes"],
 ["The compressor pumps until the governor stops it at cut-out, and starts it again at cut-in.","The dryer strips water and oil from the air. It purges (dumps) them at cut-out.","Service brakes are applied BY air. Spring brakes are applied by big springs and RELEASED by air.","Lose air and the spring brakes come on by themselves. That's the fail-safe.","Pushrod stroke shows brake adjustment. Auto slack adjusters should keep it in limit. If one doesn't, the adjuster is bad."],
 [["Governor cut-out","120–130 psi typical"],["Build-up","50→90 psi under 3 min at 1,200 rpm"],["FMVSS 121 check","85→100 psi within 40 s"],["Low air warning","On below about 60 psi"],["Park knob pops","20–45 psi range"]],
 "Why do spring brakes apply when the air is lost?",["A valve applies them with reserve air","Springs apply them; air holds them off","The driver has to pull the yellow knob"],1,"Air holds the spring caged. No air, the spring wins and the brake applies."),
"013abs":B("Anti-lock brakes (ABS)",["Tone ring","Wheel speed sensor","ABS ECU","Modulator valve","Brake chamber"],
 ["Each sensed wheel has a toothed tone ring and a magnetic sensor that makes an AC signal as it turns.","The ECU compares wheel speeds. If one slows too fast (about to lock), it pulses that wheel's modulator: release, hold, reapply.","Common faults: open or shorted sensor, sensor pushed out (gap too big), damaged tone ring, chafed wiring.","Measure at the ECU connector, then right at the sensor. That splits wiring from the part.","If ABS fails, normal braking still works, just without anti-lock."],
 [["Sensor coil","about 1,000–2,500 Ω typical"],["Signal","AC volts rise as the wheel spins faster"]],
 "Sensor reads OL at the ECU and still OL right at the sensor. The fault is:",["The harness","The sensor","The ECU"],1,"Open at both ends means the open is in the sensor itself."),
"013hyd":B("Hydraulic brakes",["Pedal","Booster","Master cylinder","Brake lines","Calipers / wheel cylinders"],
 ["Brake fluid doesn't compress, so pedal force moves fluid that pushes the pads or shoes.","A booster (vacuum, hydraulic or air) multiplies the pedal force.","Pedal slowly sinks, fluid full, no outside leak = master cylinder leaking past its seals inside.","Spongy pedal = air in the lines. Bleed them.","Rotors: check thickness against the minimum stamped on them, and runout with a dial indicator."],
 [["Rotor runout","about 0.002 in max (cars, typical)"],["Fluid","Use the type on the cap. Never mix DOT 5 in."]],
 "Pedal sinks slowly while holding at a light. Fluid is full, no leaks. Most likely?",["Air in the lines","Master cylinder bypassing inside","Worn pads"],1,"Fluid is going somewhere you can't see: past the master cylinder seals."),
"014":B("Frame",["Frame rails","Crossmembers","Hangers & brackets"],
 ["Truck frames are a ladder: two rails joined by crossmembers.","Rails are often heat-treated. Welding or torch heat in the wrong spot weakens them.","Never drill or weld the top or bottom flanges. Follow the OEM frame manual for holes and reinforcements.","Cracks start at holes, corners, and where loose parts let things move. A rust line can be a crack.","Fix the cause (loose bolts, overload), not just the crack."],
 [],"Where should you never drill a hole in a frame rail?",["In the top or bottom flange","In the web, per the OEM manual","Near a crossmember"],0,"The flanges carry most of the bending load. Holes there start cracks."),
"015":B("Steering",["Steering wheel","Column","Power steering gear","Pitman arm","Drag link","Steer arm","Knuckle","Tie rod"],
 ["The pump supplies oil flow. The gear uses it to help you turn.","Hard steering that gets easier with more RPM = weak pump flow.","Dry park check: engine running, wheels on the ground, someone rocks the wheel while you watch every joint.","Toe is set by tie rod length. Too much toe-out wears the inside edges and makes the truck wander.","Fix worn parts first, then align."],
 [["Toe-in","about 1/16 in (± 1/32) typical"]],
 "Steering is hard at idle, easier at higher RPM. Points to:",["Steering gear","Power steering pump","Tie rod ends"],1,"Pump output rises with RPM. If more RPM fixes it, the pump is weak."),
"016":B("Suspension",["Air tank","Pressure protection valve","Height control valve","Air springs","Shocks","Torque rods"],
 ["Air ride uses a height valve linked to the axle. Truck low: valve fills the bags. Truck high: valve dumps air.","Set ride height after any work. Wrong height changes driveline angles and causes vibration.","Leaf springs are clamped by U-bolts. Loose U-bolts break leaves. Use new U-bolts and retorque after a short run.","Shocks stop bouncing. Weak shocks cause cupped tires.","Torque rods keep the axles square. Worn bushings let the axles steer the truck."],
 [],"Steer tires are cupping and the front bounces. Check first:",["Shocks","Kingpins","Toe"],0,"A tire that bounces scrubs a patch every time it lands. Weak shocks let it bounce."),
"017":B("Tires",["Rim","Bead","Sidewall","Tread"],
 ["Air pressure carries the load. Check cold with a gauge, not by thumping.","Duals must match in pressure, diameter and circumference, or one tire scrubs and the diff works all the time.","Bulges or cuts down to the cords = out of service.","Steer tires need more tread than drive and trailer tires. Check the provincial minimum.","Leaky valve cores and missing caps are common slow leaks."],
 [],"Why does an underinflated dual wear faster than its partner?",["It runs hotter only","It's smaller around, so it scrubs every turn","It carries more load"],1,"Smaller rolling diameter. It has to slide to keep up with its partner."),
"018":B("Wheels & studs",["Hub","Studs","Wheel (hub-piloted)","Flange nuts"],
 ["Most current wheels are hub-piloted: the hub centers the wheel, the nuts only clamp it.","Clamp force holds the wheel, not the studs. Lose clamp and the wheel starts moving.","Clean the mating faces. Tighten in a star pattern, in stages, with a torque wrench.","Rust streaks or shiny marks from the nuts = the wheel is moving. Deal with it now.","Retorque after the first short run."],
 [["Stage torque","~50 lb-ft, then 50–80 %, then final"],["Final (typical)","450–500 lb-ft, check OEM"]],
 "Why tighten wheel nuts in a star pattern and in stages?",["It's faster","To pull the wheel down evenly against the hub","So you can use an impact"],1,"Even clamp all the way around. One side tight first can cock the wheel."),
"022":B("Drive axles",["Driveshaft","Pinion","Ring gear","Differential","Axle shafts"],
 ["The pinion turns the ring gear. The differential lets left and right wheels turn at different speeds in a turn.","Tandems have an inter-axle differential (power divider) that splits power between the two axles.","Lock the inter-axle diff only when stopped or creeping straight. Never while wheels are spinning.","Low gear oil kills pinion bearings. Check level at the fill plug.","Axle vents let heat and pressure out. A plugged vent pushes oil past the seals."],
 [],"An axle vent is plugged with mud. What happens?",["Nothing","Pressure pushes oil past the seals","The diff locks"],1,"Heat builds pressure with nowhere to go except out the seals."),
"023":B("Clutch",["Pedal","Linkage","Release fork","Release bearing","Pressure plate","Disc(s)","Flywheel"],
 ["Free pedal (1½–2 in) is the slack before the bearing starts to move. As the disc wears, free pedal gets smaller.","Manual-adjust clutches have an internal adjusting ring. Self-adjusting ones do it on their own.","The last ½–1 in of pedal squeezes the clutch brake. It stops the input shaft so 1st or reverse go in at a stop.","Never use the clutch brake while moving. It isn't made for that and overheats.","Oil on the disc = chatter or slip. Fix the leak and replace the clutch."],
 [["Free pedal","1½–2 in"],["Bearing to clutch brake","½–9/16 in (Eaton manual-adjust)"]],
 "Free pedal has shrunk to ¼ inch. That means:",["Clutch is worn and needs adjusting","Linkage is too loose","Clutch brake is worn"],0,"The disc wore thinner, so the bearing moved closer. Adjust before it starts slipping."),
"024":B("Driveshaft",["Transmission yoke","U-joint","Slip yoke","Tube","Center bearing","Axle yoke"],
 ["U-joints let the shaft work through angles. Grease until all four caps purge.","The slip yoke lets the shaft change length as the suspension moves.","Phasing: the yokes on each end of a shaft must line up. One spline off = vibration. Mark it before you pull it apart.","Long shafts use center bearings. Torn rubber = rumble."],
 [],"You grease a U-joint and only 3 of 4 caps purge. Next?",["Good enough","Fix it: that cap will fail","Add more grease next PM"],1,"The dry cap gets no lube and will wear out. Work it until it purges, or replace the joint."),
"025":B("PTO",["Transmission gear","PTO unit","Air/electric shift","Hydraulic pump","Control valve","Cylinder"],
 ["A PTO takes power from a transmission gear to run a pump: dump box, crane, blower.","Engaging: switch → solenoid → air to the shift cylinder → PTO gear slides in.","Split it: power at the solenoid? air coming out? pump turning?","Engage it the way the maker says (usually stopped, clutch in)."],
 [],"PTO solenoid has 12 V but no air comes out. The fault is:",["Switch","Solenoid valve","Hydraulic pump"],1,"Signal in, nothing out = the part in the middle."),
"026":B("Transmission",["Input shaft","Countershafts","Main shaft gears","Output shaft"],
 ["Big manual transmissions (twin countershaft) split the torque across two countershafts.","Range shifts use air: filter/regulator (about 60 psi) → knob → slave valve → range cylinder.","Follow the air. Where it stops is the fault.","Automatics need the right fluid level, checked hot. Low fluid = slipping.","Jumping out of gear: check mounts and linkage before opening the box."],
 [["Range air","about 60 psi from the regulator"]],
 "Range won't shift. Air reaches the slave valve but not the range cylinder. Fault?",["Shift knob","Slave valve","Regulator"],1,"Air into the valve, none out of it."),
"031":B("Charging system",["Alternator stator","Diodes (rectifier)","Regulator","Charge cable","Batteries"],
 ["The alternator makes AC. Diodes turn it into DC. The regulator holds the voltage steady.","Bad diodes: low output and AC ripple showing on the output.","Some alternators need an ignition (turn-on) or sense wire. No signal, no charge.","Check voltage drop on the charge cable at full output.","Batteries can't fix a charging problem. Test both."],
 [["Charging","about 13.8–14.4 V"],["Charge cable drop","≤ 0.2 V (12-V system, full output)"]],
 "13.0 V running and 0.9 V AC on the alternator output. Fault?",["Batteries","Alternator diodes","Belt slipping"],1,"AC on a DC output means diodes aren't rectifying."),
"032":B("Cranking system",["Key / start switch","Magnetic switch","Starter solenoid","Starter motor","Heavy cables","Ground return"],
 ["A small current from the key closes the solenoid. The solenoid's big contacts send battery power to the motor.","Voltage drop while cranking finds bad cables and grounds. Test both positive and ground sides.","On the starter: B = battery in, S = switch signal, M = motor feed. Find where the power stops.","Don't crank for long stretches. Starters overheat."],
 [["Each side voltage drop","under about 0.5 V while cranking"]],
 "One click, no crank. B has 12 V, S has 12 V, M has 0 V. Fault?",["Battery","Solenoid contacts","Ignition switch"],1,"Power and signal are in. Nothing comes out the M terminal."),
"033":B("Ignition (gas engines)",["Battery","Ignition coil","Spark plug","ECM trigger"],
 ["Gas engines need a spark. Diesels light fuel with compression heat instead.","Misfire codes P030x say which cylinder.","Swap test: move the coil to another cylinder. If the misfire follows, it's the coil.","A compression test rules out mechanical problems."],
 [],"You swap coil 3 to cylinder 1 and the code changes to P0301. Fault?",["Plug 3","Coil","Injector 3"],1,"The misfire followed the part you moved."),
"034":B("Lighting",["Battery","Fuse","Switch / module","Wire","Connector","Lamp","Ground wire","Frame"],
 ["Every lamp needs power in and a ground out. Half of lighting problems are grounds.","Voltage drop test with the lamp ON: power side and ground side, each under about 0.2 V.","7-way: white ground, black clearance, yellow left, red stop, green right, brown tail, blue ABS/aux.","A fuse that keeps blowing = a short. Split the circuit to find it. Never put in a bigger fuse.","Don't pierce wires. Ontario salt gets in and rots the copper."],
 [["Voltage drop","under about 0.2 V per side"]],
 "Lamp feed has full 12.4 V but the lamp is dim. Next test?",["Replace the bulb","Voltage drop on the ground side","Check the fuse"],1,"Power is arriving. Something is stopping current on the way out."),
"035":B("Batteries",["Batteries in parallel","Cables","Load"],
 ["Resting voltage shows charge: 12.6 V full, 12.4 V ~75 %, 12.2 V ~50 %, 12.0 V ~25 %.","Load test: half the CCA rating for 15 s. Must stay above 9.6 V at 21 °C (70 °F).","Truck banks are in parallel. One bad battery drags the good ones down. Test them separated.","Replace with the same type, and ideally the same age."],
 [["Full charge","12.6 V"],["Load test","½ CCA for 15 s, stay above 9.6 V"]],
 "Bank reads 12.4 V. Separated: three read 12.6 V, one reads 11.9 V. Next?",["Charge the bank","Load test the 11.9 V battery","Replace all four"],1,"That one is the suspect. Prove it with a load test."),
"041":B("Air intake & turbo",["Air filter","Turbo compressor","Charge air cooler","Intake manifold","Cylinders"],
 ["The turbo uses exhaust energy to spin a compressor that pushes in more air (boost).","Squeezing air heats it. The charge air cooler (CAC) cools it so it's denser.","Leaks after the turbo lose boost: black smoke and low power.","CAC leak test: pressurize, time the drop. Spec depends on the maker.","Air filters: go by the restriction gauge, not just mileage."],
 [["CAC test (Cummins)","30 psi, max 7 psi drop in 15 s"],["CAC test (Cat, Detroit)","about 5 psi drop in 15 s"]],
 "Black smoke and low power. Where do you look first?",["Injectors","Boost leaks after the turbo","Fuel filter"],1,"Less air with the same fuel = black smoke. Check the cheap, likely stuff first."),
"042":B("Cooling system",["Water pump","Block & head","Thermostat","Radiator","Fan","Back to pump"],
 ["The thermostat stays shut until the engine warms, then opens to the radiator.","The pressure cap raises the boiling point. Never open it hot.","Many fan clutches are spring-ON, air-OFF. Air holds them off, so they fail engaged.","Pressure-test to find leaks. Coolant from the water pump weep hole = failed seal.","Coolant boils first at the pump inlet, the lowest-pressure spot."],
 [["Normal running temp","about 85–95 °C typical"]],
 "Spring-engaged fan clutch. Fan should be ON, but air is still at the clutch. Fault?",["Fan clutch worn","Solenoid valve stuck passing air","ECM not commanding"],1,"Air holds the fan off. If air is still there when the ECM says 'on', the valve isn't exhausting."),
"043":B("Exhaust & aftertreatment",["Turbo","DOC","DPF","DEF doser","SCR","Outlet NOx sensor"],
 ["DOC burns leftover fuel in the exhaust and heats it up for regens.","DPF traps soot. Regens burn soot into ash. Ash only comes out by cleaning the DPF.","SCR uses DEF (urea solution) to turn NOx into nitrogen and water.","NOx sensors before and after the SCR show how well it's working.","DEF freezes at about −11 °C, so the tank and lines are heated."],
 [["DEF strength","about 32.5 % urea"],["DEF freezes","−11 °C (12 °F)"]],
 "DPF pressure is still high right after a successful regen. Why?",["Soot","Ash","Bad DEF"],1,"Regen burns soot. Ash is left behind and only cleaning removes it."),
"044":B("Fuel system",["Tank","Fuel/water separator","Transfer pump","Secondary filter","High-pressure pump","Rail","Injectors"],
 ["Suction side (before the transfer pump) is under vacuum: leaks let air IN, not fuel out.","Pressure side: leaks spray fuel. Never touch a high-pressure leak. It can inject fuel into your skin.","High suction restriction = plugged filter or pickup.","Prime after filter changes. Don't crank to prime.","Leaking injectors can thin the engine oil with fuel."],
 [],"Clear line on the suction side shows bubbles. Fault?",["Air leak on the suction side","Bad injector","Weak batteries"],0,"Bubbles before the pump mean air is getting in somewhere upstream."),
"044car":B("Car fuel trims",["MAF sensor","ECM","Injectors","O2 sensor feedback"],
 ["The ECM fine-tunes fuel using O2 sensor feedback. That correction is called fuel trim.","Positive trim = ECM adding fuel because it sees lean.","Lean at idle, normal at higher RPM = vacuum leak.","Lean everywhere, or worse under load = fuel delivery (pump, filter, injectors).","A smoke test finds intake leaks fast."],
 [],"Trims +22 % at idle, +3 % at 2,500 rpm. Points to:",["Weak fuel pump","Vacuum leak","Bad O2 sensor"],1,"At idle the leak is a big share of the air. At higher RPM it barely matters."),
"045":B("Diesel engine",["Intake","Compression","Power","Exhaust"],
 ["Diesels light the fuel with the heat of compression. No spark plugs.","Valve lash (clearance) grows as parts wear. Overhead adjustments reset it on schedule.","Engine brakes open the exhaust valves near the top of compression, so the engine absorbs power. Solenoids run them by cylinder bank.","Low oil pressure plus a RISING oil level = fuel getting into the oil.","Confirm with a mechanical gauge before condemning parts."],
 [],"Engine brake feels the same on MED and HIGH. Likely?",["One bank's solenoid not working","Wrong oil","Turbo failing"],0,"The steps add cylinder banks. One dead bank makes two steps feel the same."),
"046":B("EGR & crankcase",["Exhaust","EGR cooler","EGR valve","Intake"],
 ["EGR sends cooled exhaust back into the intake. That lowers combustion heat and NOx.","The EGR cooler is a coolant heat exchanger. An internal leak puts coolant into the exhaust: sweet white smoke, coolant loss, no puddle.","An EGR valve stuck open at idle = rough idle and smoke.","The crankcase vent filter handles blow-by gases. Plugged = high crankcase pressure, oil pushed out the seals."],
 [],"Losing coolant, no puddles, clean oil, sweet white smoke on startup. Check:",["Water pump","EGR cooler","Radiator"],1,"Coolant leaving through the exhaust points to the EGR cooler."),
"052":B("Electrical accessories",["Fuse","Switch","Accessory load","Ground"],
 ["Aftermarket add-ons (inverters, lights, fridges) are the top cause of dead batteries.","Parasitic draw: measure with the key off after the modules go to sleep. Pull fuses one at a time and watch the meter.","After any work near doors or hinges, check for pinched wires.","Every accessory circuit is the same: fuse → switch → load → ground."],
 [["Key-off draw","typically under about 0.1 A after sleep (check OEM)"]],
 "Draw is 2.3 A with everything off. How do you find it?",["Replace the batteries","Pull fuses one at a time while watching the meter","Replace the alternator"],1,"When the draw drops, you've found the circuit."),
"055":B("Liftgate",["Battery","Motor relay","Pump motor","Hydraulic pump","Lift cylinder","Lowering valve"],
 ["Lifting uses the motor and pump. Lowering opens a valve and gravity pushes the oil back.","Motor runs but nothing lifts: low fluid, a leak, or the pump.","Won't come down: the lowering valve coil or its signal.","Liftgate batteries and the charge line from the tractor are common weak spots."],
 [],"Gate goes up fine but won't come down. Check first:",["Pump motor","Lowering valve and its signal","Fluid level"],1,"Lowering doesn't use the motor at all."),
"059":B("Coupling & fifth wheel",["Trailer kingpin","Fifth wheel jaws / lock","Gladhands","7-way cord"],
 ["The fifth wheel lock holds the trailer kingpin. Slack in it causes clunks and shock loads.","Adjust per the maker, grease the plate, and check kingpin wear with a gauge.","Red gladhand = supply/emergency. Blue = service. Cracked seals leak.","Light visible between the trailer and the fifth wheel plate = not coupled right. Out of service."],
 [],"The red gladhand carries:",["Service (brake application) air","Supply/emergency air","Air for the ABS"],1,"Red feeds the trailer tanks and releases its spring brakes."),
"069":B("Reefer",["Compressor","Condenser","Expansion valve","Evaporator (in box)"],
 ["Same refrigeration cycle as the A/C, just colder. A small diesel engine drives it.","Dirty condenser = high discharge pressure and lost cooling.","Defrost cycles clear ice off the evaporator.","Small diesels need glow plugs to start cold."],
 [],"High discharge pressure and the box won't hold temp. Check first:",["Condenser coil","Door seals","Compressor"],0,"A plugged condenser can't get rid of heat. Cheap fix, check it first."),
"081":B("APU",["APU engine","Generator / compressor","Cab heat & A/C","Battery charging"],
 ["A small diesel that runs cab heat, A/C and charging so the truck doesn't idle.","It has its own shutdowns: low oil, low coolant, high temperature. Read the fault history first.","Often shares fuel and sometimes coolant with the truck."],
 [],"APU cranks but won't run. First step?",["Replace the glow plugs","Read its shutdown history","Replace the fuel pump"],1,"The unit records why it shut down. Start there.")
};
const BK={A103:"013abs",B137:"013hyd",P801:"013hyd",P802:"044car"};
const briefOf=j=>BRIEF[BK[j.id]||vmOf(j)];
const briefKey=j=>BK[j.id]||vmOf(j);

// ---------- state ----------
const KEY="bay3-v1";
let S={rep:0,cash:0,done:{},cur:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let view=S.cur?"job":"board", fType="all", fSys="all";
const isCar=j=>j.sys==="car";

const $=s=>document.querySelector(s);
const money=n=>"$"+Math.round(n).toLocaleString();
const rankIdx=()=>RANKS.reduce((a,r,i)=>S.rep>=r.r?i:a,0);
const unlocked=j=>j.lvl===1||(j.lvl===2&&S.rep>=40)||(j.lvl===3&&S.rep>=100);
const jobById=id=>JOBS.find(j=>j.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function header(){
  $("#sRep").textContent=S.rep;$("#sCash").textContent=money(S.cash);
  $("#rankName").textContent=RANKS[rankIdx()].n.toUpperCase();
  document.querySelectorAll("nav button").forEach(b=>b.toggleAttribute("aria-current",false));
  const b=document.querySelector(`nav button[data-v="${view}"]`);if(b)b.setAttribute("aria-current","page");
}

function board(){
  const list=JOBS.filter(j=>(fType==="all"||(fType==="car")===isCar(j))&&(fSys==="all"||vmOf(j)===fSys)).sort((a,b)=>vmOf(a).localeCompare(vmOf(b)));
  const codes=Object.keys(VMRS).filter(k=>JOBS.some(j=>vmOf(j)===k));
  const lv=l=>l===1?"":l===2?"Needs 40 rep":"Needs 100 rep";
  return `<div class="section"><h1>Job Board</h1>
  <p class="muted">${JOBS.length} work orders across ${codes.length} VMRS systems. Run tests, find the cause, pick the fix. Flat rate: ${money(RATE)} × book hours if you get it right.</p>
  <div class="filters">${["all","truck","car"].map(k=>`<button class="fbtn" data-f="${k}" aria-pressed="${fType===k}">${{all:"All",truck:"Heavy truck",car:"Car"}[k]}</button>`).join("")}</div>
  <label class="label" for="sysSel">VMRS system</label>
  <select id="sysSel" class="fsel"><option value="all">All systems</option>${codes.map(k=>`<option value="${k}" ${fSys===k?"selected":""}>${k} · ${VMRS[k]}</option>`).join("")}</select>
  <div class="jobs">${list.length?"":`<p class="muted">No jobs match that filter.</p>`}${list.map(j=>{const d=S.done[j.id];const open=unlocked(j);
    return `<button class="job" data-j="${j.id}" ${open?"":"disabled"}>
      <span class="ro">RO ${j.id}</span>
      <span style="min-width:0"><span class="tag">VMRS ${vmOf(j)}</span><span class="tag">${isCar(j)?"Car":"Truck"}</span><span class="tag">${"●".repeat(j.lvl)}${"○".repeat(3-j.lvl)}</span>
      <div class="t">${j.title}</div><div class="u">${j.unit}${open?"":" · "+lv(j.lvl)}</div></span>
      <span class="grade ${d?"g-"+d.g:""}">${d?d.g:"—"}</span></button>`}).join("")}</div></div>`;
}

function hoursUsed(j,c){return c.ran.reduce((a,i)=>a+j.tests[i].h,0)+(c.fix!=null&&c.res?j.fixes[c.fix].h:0)}

function job(){
  const c=S.cur;
  if(!c)return `<div class="section"><h1>No open work order</h1><p class="muted">Grab a job from the board.</p><div><button class="btn" data-go="board">Go to Job Board</button></div></div>`;
  const j=jobById(c.id), used=c.ran.reduce((a,i)=>a+j.tests[i].h,0), pct=Math.min(100,used/j.book*100);
  const tools=[...new Set(j.tests.map(t=>t.t))];
  let h=`<div class="section"><div class="wo">
   <div class="wo-top"><span>REPAIR ORDER ${j.id}</span><span>VMRS ${vmOf(j)} · ${VMRS[vmOf(j)].toUpperCase()}</span></div>
   <div class="wo-body"><h1>${j.title}</h1>
    <div class="kv"><div><b>Unit</b>${j.unit}</div><div><b>Odometer</b>${j.km}</div><div><b>Book time</b>${j.book.toFixed(1)} h</div></div>
    <div class="complaint"><span class="label">Customer concern</span><br>${j.complaint}</div>
    <div class="clock"><span>Diag ${used.toFixed(1)} h</span><div class="bar"><i class="${used>j.book*0.6?"over":""}" style="width:${pct}%"></i></div><span>${j.book.toFixed(1)} h</span></div>
   </div></div></div>`;
  if(c.res) return h+result(j,c);
  const bf=briefOf(j);
  if(bf){
    const body=`<div class="flow">${bf.flow.map(x=>`<span>${x}</span>`).join('<i aria-hidden="true">→</i>')}</div>
     <ul class="bpts">${bf.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
     ${bf.specs.length?`<div class="kv">${bf.specs.map(s=>`<div><b>${s[0]}</b>${s[1]}</div>`).join("")}</div>`:""}`;
    if(c.bq==null) return h+`<div class="section"><h2>0 · Shop class: ${bf.t}</h2><div class="wo"><div class="wo-body">${body}
      <div class="note"><span class="label">Quick check before you start</span><br>${bf.q}</div>
      <div class="opts">${bf.o.map((x,i)=>`<button class="test" data-bq="${i}"><span>${x}</span></button>`).join("")}</div></div></div></div>`;
    h+=`<div class="section"><details class="wo"${c.bopen?" open":""}><summary class="wo-top"><span>SHOP CLASS · ${bf.t.toUpperCase()}</span><span>${c.bq===bf.a?"✔ CHECK PASSED":"✘ REVIEW"}</span></summary><div class="wo-body">${body}<div class="note"><b>${bf.q}</b><br>${bf.o[bf.a]}. ${bf.why}</div></div></details></div>`;
  }
  h+=`<div class="section"><h2>1 · Run tests</h2><p class="muted">Every test costs shop time. Don't run everything. Think about what the complaint tells you.</p>
   <div class="tools">${tools.map(t=>`<div class="tg"><span class="label">${t}</span>${j.tests.map((x,i)=>x.t!==t?"":`<button class="test" data-t="${i}" ${c.ran.includes(i)?"disabled":""}><span>${x.n}</span><span class="h">${c.ran.includes(i)?"done":x.h.toFixed(1)+" h"}</span></button>`).join("")}</div>`).join("")}</div></div>
   <div class="section"><h2>Findings</h2><div class="log" id="log">${c.ran.length?c.ran.map(i=>`<div class="e"><b>▸ ${esc(j.tests[i].n)}</b><br>${esc(j.tests[i].r)}</div>`).join(""):`<div class="empty">No readings yet. Run a test.</div>`}</div></div>
   <div class="section"><h2>2 · Cause</h2><div class="opts">${j.causes.map((x,i)=>`<label class="opt"><input type="radio" name="cause" id="cause${i}" value="${i}" ${c.cause===i?"checked":""}><span>${x}</span></label>`).join("")}</div></div>
   <div class="section"><h2>3 · Repair</h2><div class="opts">${j.fixes.map((x,i)=>`<label class="opt"><input type="radio" name="fix" id="fix${i}" value="${i}" ${c.fix===i?"checked":""}><span>${x.n}<small>Parts ${money(x.p)} · Labour ${x.h.toFixed(1)} h</small></span></label>`).join("")}</div></div>
   <div class="section"><div class="row"><button class="btn" id="submit" ${c.cause==null||c.fix==null?"disabled":""}>Close repair order</button><button class="btn ghost" id="abandon">Give back to service writer</button></div></div>`;
  return h;
}

function result(j,c){
  const r=c.res;
  const cls=r.g==="A"||r.g==="B"?"ok":r.g==="C"?"part":"fail";
  const keys=j.tests.map((t,i)=>t.k?i:-1).filter(i=>i>=0);
  return `<div class="section"><div class="result ${cls}">
   <span class="label">Result</span>
   <div class="row" style="align-items:baseline;gap:16px"><span class="big g-${r.g}">${r.g}</span><span>${r.msg}</span></div>
   <div class="kv"><div><b>Paid</b>${money(r.pay)}</div><div><b>Rep</b>${r.rep>=0?"+":""}${r.rep}</div><div><b>Total time</b>${r.hrs.toFixed(1)} h of ${j.book.toFixed(1)}</div></div>
   <div class="note"><span class="label">Actual cause</span><br>${j.causes[j.c]} → ${j.fixes[j.f].n}</div>
   <div class="note"><span class="label">Shop foreman says</span><br>${j.note}</div>
   <div class="note"><span class="label">Tests that cracked it</span><br>${keys.map(i=>(c.ran.includes(i)?"✔ ":"✘ ")+j.tests[i].n).join("<br>")}</div>
  </div></div>
  <div class="section"><div class="row"><button class="btn" data-go="board">Next job</button><button class="btn ghost" id="retry">Redo this job</button></div></div>`;
}

function career(){
  const ri=rankIdx(),done=Object.keys(S.done).length,as=Object.values(S.done).filter(d=>d.g==="A").length;
  const next=RANKS[ri+1];
  return `<div class="section"><h1>${RANKS[ri].n}</h1>
   <p class="muted">${next?`${next.r-S.rep} rep to ${next.n}.`:"Top of the ladder. Your own shop."}</p>
   <div class="kv"><div><b>Jobs closed</b>${done} / ${JOBS.length}</div><div><b>A grades</b>${as}</div><div><b>Earned</b>${money(S.cash)}</div><div><b>Shop classes passed</b>${Object.keys(S.briefs||{}).length} / ${Object.keys(BRIEF).length}</div></div></div>
   <div class="section"><h2>System coverage</h2><div class="ranks">${Object.keys(VMRS).filter(k=>JOBS.some(j=>vmOf(j)===k)).map(k=>{const js=JOBS.filter(j=>vmOf(j)===k),d=js.filter(j=>S.done[j.id]&&S.done[j.id].g!=="F").length;return `<div class="rank ${d===js.length?"on":""}">${k} · ${VMRS[k]}<span>${d}/${js.length}</span></div>`}).join("")}</div></div>
   <div class="section"><h2>Ladder</h2><div class="ranks">${RANKS.map((r,i)=>`<div class="rank ${i===ri?"on":""}">${r.n}<span>${r.r} rep</span></div>`).join("")}</div>
   <p class="muted">Grading: right cause + right fix = A or B (B if you went over book time). Right cause, wrong fix = C. Wrong cause = F and a comeback. Redoing a job only counts your best grade.</p></div>
   <div class="section"><div><button class="btn ghost" id="reset">Reset progress</button></div><div id="resetConfirm" hidden class="row"><span class="muted">Wipe all progress?</span><button class="btn" id="resetYes">Yes, wipe</button><button class="btn ghost" id="resetNo">Cancel</button></div></div>`;
}

function render(){
  $("#app").innerHTML=view==="board"?board():view==="job"?job():view==="tools"?toolsView():view==="lab"?labView():career();
  header();
  if(view==="lab"&&window.labAfter)labAfter();
  if(view==="tools"&&window.learnAfter)learnAfter();
}

function grade(j,c){
  const okC=c.cause===j.c, okF=c.fix===j.f;
  const hrs=hoursUsed(j,c)+j.fixes[c.fix].h;
  let g,msg,pay=0,rep=0;
  if(okC&&okF){
    const keyRan=j.tests.filter((t,i)=>t.k&&c.ran.includes(i)).length;
    const guessed=keyRan===0;
    if(guessed){g="C";msg="Right answer, but no test backed it up. That's a guess, not a diagnosis.";pay=j.book*RATE*.5;rep=4}
    else if(hrs<=j.book){g="A";msg="Fixed right the first time, under book.";pay=j.book*RATE;rep=15}
    else{g="B";msg="Fixed right, but went over book time.";pay=j.book*RATE;rep=10}
  }else if(okC){g="C";msg="Right cause, wrong repair. Customer comes back, partial pay.";pay=j.book*RATE*.4;rep=3}
  else{g="F";msg="Wrong cause. Truck comes back. Comeback costs the shop.";pay=0;rep=-5}
  return {g,msg,pay,rep,hrs};
}

const order={A:4,B:3,C:2,F:1};
document.addEventListener("click",e=>{
  const t=e.target.closest("button,input");if(!t)return;
  if(t.dataset.v){view=t.dataset.v;render();window.scrollTo(0,0);return}
  if(t.dataset.go){view=t.dataset.go;if(S.cur&&S.cur.res)S.cur=null;save();render();window.scrollTo(0,0);return}
  if(t.dataset.f){fType=t.dataset.f;render();return}
  if(t.dataset.j){S.cur={id:t.dataset.j,ran:[],cause:null,fix:null,res:null};save();view="job";render();window.scrollTo(0,0);return}
  if(t.dataset.bq!=null&&S.cur){const j=jobById(S.cur.id),bf=briefOf(j),k=briefKey(j),i=+t.dataset.bq;S.cur.bq=i;S.cur.bopen=i!==bf.a;S.briefs=S.briefs||{};if(i===bf.a&&!S.briefs[k]){S.briefs[k]=1;S.rep+=2}save();render();return}
  if(t.dataset.t!=null){const i=+t.dataset.t;if(!S.cur.ran.includes(i))S.cur.ran.push(i);save();const y=window.scrollY;render();window.scrollTo(0,y);const l=$("#log");if(l)l.scrollTop=l.scrollHeight;return}
  if(t.name==="cause"){S.cur.cause=+t.value;save();$("#submit").disabled=S.cur.fix==null;return}
  if(t.name==="fix"){S.cur.fix=+t.value;save();$("#submit").disabled=S.cur.cause==null;return}
  if(t.id==="submit"){const j=jobById(S.cur.id),r=grade(j,S.cur);S.cur.res=r;
    const prev=S.done[j.id];
    if(!prev){S.rep=Math.max(0,S.rep+r.rep);S.cash+=r.pay;S.done[j.id]={g:r.g}}
    else if(order[r.g]>order[prev.g]){S.rep+=Math.max(0,r.rep-3);S.cash+=r.pay*.25;S.done[j.id]={g:r.g};r.msg+=" (Redo: reduced pay/rep.)"}
    else{r.msg+=" (Redo: no extra pay or rep.)";r.pay=0;r.rep=0}
    save();render();window.scrollTo(0,0);return}
  if(t.id==="abandon"){S.cur=null;save();view="board";render();return}
  if(t.id==="retry"){const id=S.cur.id;S.cur={id,ran:[],cause:null,fix:null,res:null};save();render();window.scrollTo(0,0);return}
  if(t.id==="reset"){$("#resetConfirm").hidden=false;return}
  if(t.id==="resetNo"){$("#resetConfirm").hidden=true;return}
  if(t.id==="resetYes"){S={rep:0,cash:0,done:{},cur:null};save();view="board";render();return}
});
document.addEventListener("change",e=>{if(e.target.id==="sysSel"){fSys=e.target.value;render()}});
render();
</script>

  use:"Cut zip ties and wire, strip insulation without nicking copper, crimp terminals.",tip:"Use the stripper hole that matches the wire gauge. Nicked strands break later."},
 {id:"ballpeen",cat:"Striking & prying",name:"Ball-peen hammer",svg:SV(`<line x1="60" y1="25" x2="60" y2="65" stroke-width="5"/><rect x="38" y="12" width="36" height="14" rx="3"/><circle cx="80" cy="19" r="7"/>`),

 {id:"deadblow",cat:"Striking & prying",name:"Dead-blow hammer",svg:SV(`<line x1="60" y1="28" x2="60" y2="65" stroke-width="5"/><rect x="30" y="10" width="60" height="20" rx="8"/>`),

 {id:"tapdie",cat:"Thread repair",name:"Taps & dies",svg:SV(`<line x1="25" y1="15" x2="25" y2="58" stroke-width="7" stroke-dasharray="3 2"/><circle cx="85" cy="35" r="18"/><circle cx="85" cy="35" r="7"/>`),

 {id:"impactgun",cat:"Power & air tools",name:"Impact wrench (air or cordless)",svg:SV(`<path d="M20 22 h55 v26 h-55 z"/><path d="M40 48 l-6 18 h14 l4 -18"/><line x1="75" y1="35" x2="100" y2="35" stroke-width="5"/>`),
  use:"Fast removal of wheel nuts and big fasteners. ½ in for general work, ¾ and 1 in drive for truck wheels.",tip:"Run nuts down with it, but finish wheel nuts with a torque wrench. Impact sockets only."},
 {id:"grease",cat:"Power & air tools",name:"Grease gun",svg:SV(`<rect x="15" y="25" width="60" height="20" rx="5"/><path d="M75 35 h20 q10 0 15 -12"/><path d="M30 45 l-6 15"/>`),

 {id:"jack",cat:"Lifting & safety",name:"Floor jack & jack stands",svg:SV(`<path d="M10 55 h60"/><path d="M20 55 l25 -25 h20"/><path d="M85 58 l8 -30 l8 30"/><line x1="85" y1="28" x2="101" y2="28"/>`),
  use:"Jack lifts. Stands hold. Rate them above the weight you're lifting.",tip:"NEVER work under anything held only by a jack. Put stands under a solid point before you go under."},
 {id:"chocks",cat:"Lifting & safety",name:"Wheel chocks",svg:SV(`<path d="M15 55 l35 -30 v30 z"/><path d="M70 55 l35 -30 v30 z"/><line x1="5" y1="56" x2="115" y2="56"/>`),
